name: Daily R2 Observability DB Backup

# #919 gate F: Postgres-MSwk (the observability DB backing Error Authority + the
# auth-email-failure watchdog) previously had zero backup coverage of any kind.
# This is a sibling workflow, not a second step in backup-r2-daily.yml, so a
# failure on one database can never block or mask a failure on the other
# (backup-r2-daily.yml has already failed once with no human alerting — see #921 —
# so isolating blast radius here matters). Same script, same retention policy,
# a distinct R2 prefix (backups-observability/) so the two backup sets are
# independently listable/prunable (r2-backup-run.cjs's retention math is already
# prefix-scoped via ListObjectsV2Command's Prefix filter).

on:
  workflow_dispatch:
  schedule:
    - cron: "15 2 * * *"

jobs:
  r2-backup-observability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    concurrency:
      group: r2-backup-daily-observability
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      APP_ENV: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install PostgreSQL 18 client (pg_dump, matching Postgres-MSwk's major version)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        # --ignore-scripts: this job only needs @aws-sdk/client-s3 (pure JS, no native
        # build step) — same reasoning as backup-r2-daily.yml.
        run: npm ci --ignore-scripts

      - name: Run daily observability-DB backup
        shell: bash
        env:
          DATABASE_URL_DIRECT: ${{ secrets.OBSERVABILITY_DATABASE_URL }}
          R2_BACKUP_PREFIX: "backups-observability/"
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PRIVATE_BUCKET_NAME: ${{ secrets.R2_PRIVATE_BUCKET_NAME }}
        run: |
          if [ -z "${DATABASE_URL_DIRECT}" ]; then
            echo "Missing OBSERVABILITY_DATABASE_URL secret — cannot run backup."
            exit 1
          fi
          if [ -z "${R2_ACCOUNT_ID}" ] || [ -z "${R2_ACCESS_KEY_ID}" ] || [ -z "${R2_SECRET_ACCESS_KEY}" ] || [ -z "${R2_PRIVATE_BUCKET_NAME}" ]; then
            echo "Missing one or more R2_* secrets — cannot run backup."
            echo "Required: R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_PRIVATE_BUCKET_NAME."
            exit 1
          fi
          node scripts/r2-backup-run.cjs

  notify-failure:
    needs: [r2-backup-observability]
    if: failure()
    runs-on: ubuntu-latest
    # Same environment as the backup job, so the alert secrets can live beside the other staging secrets.
    environment: staging
    steps:
      - name: Send backup-failure alert to InternalOpsAlertsService
        # The backup has ALREADY failed when this job runs. This step must never fail quietly: if the alert path is not configured,
        # or the endpoint does not accept the alert, this job goes red with an explicit error, so a failed backup is never silent.
        env:
          API_INTERNAL_BASE_URL: ${{ secrets.API_INTERNAL_BASE_URL }}
          INTERNAL_OPS_API_KEY: ${{ secrets.INTERNAL_OPS_API_KEY }}
        run: |
          if [ -z "${API_INTERNAL_BASE_URL}" ] || [ -z "${INTERNAL_OPS_API_KEY}" ]; then
            echo "::error title=Backup FAILED and nobody was alerted::API_INTERNAL_BASE_URL or INTERNAL_OPS_API_KEY is not set for this workflow, so the failure alert could not be sent. Fix the secrets and check the backup run."
            exit 1
          fi
          # The API serves this route under its global /api/v1 prefix. Accept the secret as a bare host or as host/api/v1 (with or
          # without https:// or a trailing slash) and build the one correct URL, so the alert cannot 404 on a secret-format difference.
          base="${API_INTERNAL_BASE_URL#https://}"
          base="${base%/}"
          base="${base%/api/v1}"
          alert_url="https://${base}/api/v1/internal/ops/alerts/backup-job-failure"
          status=$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' -X POST             "${alert_url}"             -H "Authorization: Bearer ${INTERNAL_OPS_API_KEY}"             -H "Content-Type: application/json"             -d '{"workflowName":"backup-r2-daily-observability","database":"observability-postgres","errorSummary":"GitHub Actions backup job failed — check run logs"}') || status="curl-failed"
          case "${status}" in
            2*) echo "Backup-failure alert accepted (HTTP ${status})." ;;
            *)
              echo "::error title=Backup FAILED and the alert was not accepted::the alert endpoint answered ${status}. Check the backup run and the API."
              exit 1
              ;;
          esac
