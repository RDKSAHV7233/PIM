name: Daily R2 Database Backup

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

jobs:
  r2-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    concurrency:
      group: r2-backup-daily
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      APP_ENV: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install PostgreSQL 18 client (pg_dump, matching the staging server major version)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        # --ignore-scripts: this job only needs @aws-sdk/client-s3 (pure JS, no native
        # build step). Without this flag, `npm ci` at the workspace root also runs
        # redis-memory-server's postinstall (native compile of redistimeseries/LibMR),
        # which this job never uses and which failed to build on this runner.
        run: npm ci --ignore-scripts

      - name: Run daily backup
        shell: bash
        env:
          DATABASE_URL_DIRECT: ${{ secrets.STAGING_DATABASE_URL_DIRECT }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PRIVATE_BUCKET_NAME: ${{ secrets.R2_PRIVATE_BUCKET_NAME }}
        run: |
          if [ -z "${DATABASE_URL_DIRECT}" ]; then
            echo "Missing STAGING_DATABASE_URL_DIRECT secret — cannot run backup."
            exit 1
          fi
          if [ -z "${R2_ACCOUNT_ID}" ] || [ -z "${R2_ACCESS_KEY_ID}" ] || [ -z "${R2_SECRET_ACCESS_KEY}" ] || [ -z "${R2_PRIVATE_BUCKET_NAME}" ]; then
            echo "Missing one or more R2_* secrets — cannot run backup."
            echo "Required: R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_PRIVATE_BUCKET_NAME."
            exit 1
          fi
          node scripts/r2-backup-run.cjs

  notify-failure:
    needs: [r2-backup]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send backup-failure alert to InternalOpsAlertsService
        # Non-blocking: a delivery failure here must never itself block anything.
        run: |
          curl -s -X POST \
            "https://${{ secrets.API_INTERNAL_BASE_URL }}/internal/ops/alerts/backup-job-failure" \
            -H "Authorization: Bearer ${{ secrets.INTERNAL_OPS_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"workflowName":"backup-r2-daily","database":"primary-postgres","errorSummary":"GitHub Actions backup job failed — check run logs"}' \
            || true
