name: Daily R2 Database Backup

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

jobs:
  r2-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    concurrency:
      group: r2-backup-daily
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      APP_ENV: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install PostgreSQL 18 client (pg_dump, matching the staging server major version)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        # --ignore-scripts: this job only needs @aws-sdk/client-s3 (pure JS, no native
        # build step). Without this flag, `npm ci` at the workspace root also runs
        # redis-memory-server's postinstall (native compile of redistimeseries/LibMR),
        # which this job never uses and which failed to build on this runner.
        run: npm ci --ignore-scripts

      - name: Run daily backup
        shell: bash
        env:
          # SEC-DB-RLS-001 7.9b, opt-in: while STAGING_BACKUP_DATABASE_URL is unset the line below resolves to the existing secret and
          # nothing changes. When a person creates the read-only vexa_backup credential and stores it there, the dump runs as that
          # identity, and the runner first checks that it really is vexa_backup (not a superuser, bypasses RLS) before it dumps.
          DATABASE_URL_DIRECT: ${{ secrets.STAGING_BACKUP_DATABASE_URL || secrets.STAGING_DATABASE_URL_DIRECT }}
          BACKUP_EXPECT_ROLE: ${{ secrets.STAGING_BACKUP_DATABASE_URL != '' && 'vexa_backup' || '' }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PRIVATE_BUCKET_NAME: ${{ secrets.R2_PRIVATE_BUCKET_NAME }}
        run: |
          if [ -z "${DATABASE_URL_DIRECT}" ]; then
            echo "Missing STAGING_BACKUP_DATABASE_URL or STAGING_DATABASE_URL_DIRECT secret — cannot run backup."
            exit 1
          fi
          if [ -z "${R2_ACCOUNT_ID}" ] || [ -z "${R2_ACCESS_KEY_ID}" ] || [ -z "${R2_SECRET_ACCESS_KEY}" ] || [ -z "${R2_PRIVATE_BUCKET_NAME}" ]; then
            echo "Missing one or more R2_* secrets — cannot run backup."
            echo "Required: R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_PRIVATE_BUCKET_NAME."
            exit 1
          fi
          node scripts/r2-backup-run.cjs

  notify-failure:
    needs: [r2-backup]
    if: failure()
    runs-on: ubuntu-latest
    # Same environment as the backup job, so the alert secrets can live beside the other staging secrets.
    environment: staging
    steps:
      - name: Send backup-failure alert to InternalOpsAlertsService
        # The backup has ALREADY failed when this job runs. This step must never fail quietly: if the alert path is not configured,
        # or the endpoint does not accept the alert, this job goes red with an explicit error, so a failed backup is never silent.
        env:
          API_INTERNAL_BASE_URL: ${{ secrets.API_INTERNAL_BASE_URL }}
          INTERNAL_OPS_API_KEY: ${{ secrets.INTERNAL_OPS_API_KEY }}
        run: |
          if [ -z "${API_INTERNAL_BASE_URL}" ] || [ -z "${INTERNAL_OPS_API_KEY}" ]; then
            echo "::error title=Backup FAILED and nobody was alerted::API_INTERNAL_BASE_URL or INTERNAL_OPS_API_KEY is not set for this workflow, so the failure alert could not be sent. Fix the secrets and check the backup run."
            exit 1
          fi
          # The API serves this route under its global /api/v1 prefix. Accept the secret as a bare host or as host/api/v1 (with or
          # without https:// or a trailing slash) and build the one correct URL, so the alert cannot 404 on a secret-format difference.
          base="${API_INTERNAL_BASE_URL#https://}"
          base="${base%/}"
          base="${base%/api/v1}"
          alert_url="https://${base}/api/v1/internal/ops/alerts/backup-job-failure"
          status=$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' -X POST             "${alert_url}"             -H "Authorization: Bearer ${INTERNAL_OPS_API_KEY}"             -H "Content-Type: application/json"             -d '{"workflowName":"backup-r2-daily","database":"primary-postgres","errorSummary":"GitHub Actions backup job failed — check run logs"}') || status="curl-failed"
          case "${status}" in
            2*) echo "Backup-failure alert accepted (HTTP ${status})." ;;
            *)
              echo "::error title=Backup FAILED and the alert was not accepted::the alert endpoint answered ${status}. Check the backup run and the API."
              exit 1
              ;;
          esac
