name: Capture Daily Rollout Evidence

on:
  workflow_dispatch:
  schedule:
    - cron: "25 4 * * *"

jobs:
  capture-daily-rollout-evidence:
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: capture-daily-rollout-evidence
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      APP_ENV: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Record daily rollout gate artifact
        shell: bash
        env:
          STAGING_SMOKE_TENANT_ID: ${{ secrets.STAGING_SMOKE_TENANT_ID }}
        run: |
          if [ -z "${STAGING_SMOKE_TENANT_ID}" ]; then
            echo "Missing STAGING_SMOKE_TENANT_ID secret for daily rollout evidence."
            exit 1
          fi
          node scripts/record-gate-signoff.cjs \
            --suite STAGING_BROAD_ROLLOUT_DAILY \
            --tenantId "${STAGING_SMOKE_TENANT_ID}" \
            --runUrl "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Resolve staging API URL
        id: resolve_staging_api_url
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_API_SERVICE || 'Vexa API' }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_API_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_ENVIRONMENT_NAME: Production
          FALLBACK_STAGING_API_URL: ${{ secrets.STAGING_BASE_URL }}
        run: |
          resolved_api_url="$(node scripts/resolve-railway-service-url.cjs 2>/dev/null || true)"
          if [ -z "${resolved_api_url}" ]; then
            resolved_api_url="${FALLBACK_STAGING_API_URL}"
          fi
          if [ -z "${resolved_api_url}" ]; then
            echo "Could not resolve staging API URL from Railway and no STAGING_BASE_URL secret fallback is configured."
            exit 1
          fi
          echo "api_url=${resolved_api_url}" >> "$GITHUB_OUTPUT"

      - name: Capture daily rollout snapshot
        shell: bash
        env:
          STAGING_BASE_URL: ${{ steps.resolve_staging_api_url.outputs.api_url }}
          STAGING_SMOKE_TENANT_ID: ${{ secrets.STAGING_SMOKE_TENANT_ID }}
          STAGING_SMOKE_WORKSPACE: ${{ secrets.STAGING_SMOKE_WORKSPACE }}
          STAGING_SMOKE_USER: ${{ secrets.STAGING_SMOKE_USER }}
          STAGING_SMOKE_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
        run: |
          if [ -z "${STAGING_BASE_URL}" ]; then
            echo "Missing STAGING_BASE_URL secret for daily rollout evidence."
            exit 1
          fi
          if [ -z "${STAGING_SMOKE_TENANT_ID}" ]; then
            echo "Missing STAGING_SMOKE_TENANT_ID secret for daily rollout evidence."
            exit 1
          fi
          node scripts/capture-controlled-rollout-snapshot.cjs \
            --environment staging \
            --tenantId "${STAGING_SMOKE_TENANT_ID}" \
            --apiBase "${STAGING_BASE_URL}/api/v1" \
            --diagnosticOutputPath ".run-logs/queue-failure-diagnostics-${GITHUB_RUN_ID}.json"

      - name: Upload daily rollout artifacts
        uses: actions/upload-artifact@v6
        with:
          name: daily-rollout-evidence-${{ github.run_id }}
          path: |
            docs/execution/gates/*.json
            docs/execution/rollout/*CONTROLLED_ROLLOUT_SNAPSHOT.json
            .run-logs/queue-failure-diagnostics-*.json
          if-no-files-found: error

      # Evidence is preserved via the artifact upload above.
      # Direct push to main is intentionally removed: branch protection requires
      # CI checks to pass before any push, so the bot commit was always
      # rejected with GH006. Artifacts in GitHub Actions are the canonical evidence store.
