name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: "22"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pim1?schema=public
      DATABASE_URL_POOLED: postgresql://postgres:postgres@localhost:5432/pim1?schema=public
      DATABASE_URL_DIRECT: postgresql://postgres:postgres@localhost:5432/pim1?schema=public
      JWT_SECRET: pim1-ci-jwt-secret-minimum-length-32
      JWT_EXPIRY: 4h
      CREDENTIAL_ENCRYPTION_KEY_V1: pim1-ci-encryption-key-v1-minimum-32
      CREDENTIAL_ENCRYPTION_KEY_CURRENT_VERSION: "1"
      REDIS_URL: redis://localhost:6379
      R2_ACCOUNT_ID: local-ci
      R2_ACCESS_KEY_ID: local-ci
      R2_SECRET_ACCESS_KEY: local-ci
      R2_BUCKET_NAME: pim1-ci
      R2_PUBLIC_URL: https://example.com/pim1-ci
      APP_ENV: development
      AUTH_MODE: local
      FEATURE_REAL_SPAPI_VALIDATION: "false"
      QUEUE_BACKEND: memory
      QUEUE_WORKER_ENABLED: "true"
      PIM_AUTH_PASSWORD: vexa-pim-demo-password
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pim1
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pim1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Security audit (fail on high+critical only)
        run: npm audit --audit-level=high

      - name: Prisma generate
        run: npm run prisma:generate

      - name: Prisma migrate deploy + RLS verification
        run: |
          npx prisma migrate deploy --schema packages/db/prisma/schema.prisma
          node scripts/verify-tenant-rls.cjs

      - name: Unsafe raw SQL comment guard
        env:
          CHECK_ONLY_CHANGED: "true"
          GIT_BASE_REF: ${{ github.event.pull_request.base.sha || 'HEAD~1' }}
        run: node scripts/check-unsafe-raw-comments.cjs

      - name: PR scope guard
        if: github.event_name == 'pull_request'
        env:
          GIT_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-pr-scope.cjs

      - name: Lint API
        run: npm run lint --workspace @pim1/api

      - name: Build API
        run: npm run build --workspace @pim1/api

      - name: Unit tests
        run: npm run test:unit --workspace @pim1/api

      - name: Tenant isolation concurrency integration test
        run: npm run test:integration:rls-isolation

      - name: Amazon authoritative validation integration test
        run: npm run test:integration:amazon-authoritative-validation

      - name: Catalog completeness integration test
        run: npm run test:integration:catalog-completeness

      - name: Outbound webhook integration test
        run: node apps/api/test/integration/outbound-webhooks.test.cjs

      - name: OpenAPI spec freshness check
        run: npm run openapi:check

      - name: Build Web
        run: npm run build --workspace @pim1/web

      - name: Seam tests (RBAC parity, plan-limit coverage, error contract)
        run: |
          if [ -d "apps/api/test/seam" ] && [ -n "$(ls apps/api/test/seam/*.cjs 2>/dev/null)" ]; then
            npx jest apps/api/test/seam/ --no-coverage
          else
            echo "Seam test directory not present yet — skipping (add tests via fix/phase3-5-tests)"
          fi

      - name: DevOps contract tests
        run: |
          node scripts/check-pr-scope.test.cjs
          node scripts/railway-deploy.test.cjs
          node scripts/validate-deploy-staging-workflow.cjs
          node scripts/validate-promote-stage3-workflow.cjs
          node scripts/validate-staging-deploy-config.test.cjs
          node scripts/migrate-legacy-auth-password-hashes.test.cjs
          node apps/api/test/integration/railway-api-package-contract.test.cjs
          node apps/web/test/integration/railway-web-runtime-contract.test.cjs
