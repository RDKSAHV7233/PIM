name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  # ── Gate: detect which areas of the codebase changed ──────────────────
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      e2e-relevant: ${{ steps.filter.outputs.e2e-relevant }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          token: ""
          filters: |
            backend:
              - 'apps/api/**'
              - 'packages/db/**'
              - 'scripts/**'
              - '.github/workflows/**'
              - 'package.json'
              - 'package-lock.json'
            e2e-relevant:
              - 'apps/**'
              - 'packages/**'
              - 'playwright*'
              - 'e2e/**'

  # ── Fast gate: lint + build (no DB, no Redis) ─────────────────────────
  # Runs on EVERY PR. Proves the code compiles. Frontend-only PRs stop here.
  build:
    needs: detect-changes
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: "22"
      DATABASE_URL: postgresql://unused:unused@localhost:5432/unused
      DATABASE_URL_POOLED: postgresql://unused:unused@localhost:5432/unused
      DATABASE_URL_DIRECT: postgresql://unused:unused@localhost:5432/unused
      JWT_SECRET: pim1-ci-jwt-secret-minimum-length-32
      JWT_EXPIRY: 4h
      CREDENTIAL_ENCRYPTION_KEY_V1: pim1-ci-encryption-key-v1-minimum-32
      CREDENTIAL_ENCRYPTION_KEY_CURRENT_VERSION: "1"
      REDIS_URL: redis://unused:6379
      R2_ACCOUNT_ID: local-ci
      R2_ACCESS_KEY_ID: local-ci
      R2_SECRET_ACCESS_KEY: local-ci
      R2_BUCKET_NAME: pim1-ci
      R2_PUBLIC_URL: https://example.com/pim1-ci
      APP_ENV: development
      AUTH_MODE: local
      FEATURE_REAL_SPAPI_VALIDATION: "false"
      QUEUE_BACKEND: memory
      QUEUE_WORKER_ENABLED: "true"
      PIM_AUTH_PASSWORD: vexa-pim-demo-password
      # redis-memory-server (a root devDependency, only used by
      # apps/api/test/integration/queue-durability.test.cjs, which this job never runs)
      # otherwise tries to download/compile a Redis Stack binary during npm ci's
      # postinstall. This is its own documented skip flag — no system redis-server needed.
      REDISMS_DISABLE_POSTINSTALL: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Security audit (fail on high+critical only)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Prisma generate
        run: npm run prisma:generate

      - name: Unsafe raw SQL comment guard
        env:
          CHECK_ONLY_CHANGED: "true"
          GIT_BASE_REF: ${{ github.event.pull_request.base.sha || 'HEAD~1' }}
        run: node scripts/check-unsafe-raw-comments.cjs

      - name: PR scope guard
        if: github.event_name == 'pull_request'
        env:
          GIT_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-pr-scope.cjs

      - name: Lint API
        run: npm run lint --workspace @pim1/api

      - name: Build API
        run: npm run build --workspace @pim1/api

      - name: OpenAPI spec freshness check
        run: npm run openapi:check

      - name: Build Web
        run: npm run build --workspace @pim1/web

      - name: DevOps contract tests
        run: |
          node scripts/check-pr-scope.test.cjs
          node scripts/railway-deploy.test.cjs
          node scripts/resolve-observability-database-url.test.cjs
          node scripts/staging-internal-ops-summary-acceptance.test.cjs
          node scripts/staging-error-authority-ops-errors-acceptance.test.cjs
          node scripts/validate-deploy-stage1-workflow.cjs
          node scripts/validate-deploy-staging-workflow.cjs
          node scripts/validate-e2e-staging-workflow.cjs
          node scripts/validate-promote-stage2-workflow.cjs
          node scripts/validate-promote-stage3-workflow.cjs
          node scripts/validate-daily-rollout-evidence-workflow.cjs
          node scripts/validate-staging-deploy-config.test.cjs
          node scripts/migrate-legacy-auth-password-hashes.test.cjs
          node apps/api/test/integration/railway-api-package-contract.test.cjs
          node apps/web/test/integration/railway-web-runtime-contract.test.cjs

  # ── Backend tests (DB + Redis required) ───────────────────────────────
  # Skipped when only frontend files change on a PR.
  backend-tests:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: "22"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pim1?schema=public
      DATABASE_URL_POOLED: postgresql://postgres:postgres@localhost:5432/pim1?schema=public
      DATABASE_URL_DIRECT: postgresql://postgres:postgres@localhost:5432/pim1?schema=public
      JWT_SECRET: pim1-ci-jwt-secret-minimum-length-32
      JWT_EXPIRY: 4h
      CREDENTIAL_ENCRYPTION_KEY_V1: pim1-ci-encryption-key-v1-minimum-32
      CREDENTIAL_ENCRYPTION_KEY_CURRENT_VERSION: "1"
      REDIS_URL: redis://localhost:6379
      R2_ACCOUNT_ID: local-ci
      R2_ACCESS_KEY_ID: local-ci
      R2_SECRET_ACCESS_KEY: local-ci
      R2_BUCKET_NAME: pim1-ci
      R2_PUBLIC_URL: https://example.com/pim1-ci
      APP_ENV: development
      AUTH_MODE: local
      FEATURE_REAL_SPAPI_VALIDATION: "false"
      QUEUE_BACKEND: memory
      QUEUE_WORKER_ENABLED: "true"
      PIM_AUTH_PASSWORD: vexa-pim-demo-password
      # redis-memory-server (a root devDependency, only used by
      # apps/api/test/integration/queue-durability.test.cjs, which isn't wired into
      # any step below) otherwise tries to download/compile a Redis Stack binary
      # during npm ci's postinstall. This is its own documented skip flag — no
      # system redis-server needed. The live redis:7 service below is unrelated:
      # it's the real Redis this job's tests connect to via REDIS_URL.
      REDISMS_DISABLE_POSTINSTALL: "true"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pim1
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pim1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npm run prisma:generate

      - name: Lint API
        run: npm run lint --workspace @pim1/api

      - name: Build API
        run: npm run build --workspace @pim1/api

      - name: Prisma migrate deploy + RLS verification
        run: |
          npx prisma migrate deploy --schema packages/db/prisma/schema.prisma
          node scripts/verify-tenant-rls.cjs

      - name: Unit tests
        run: npm run test:unit --workspace @pim1/api

      - name: Tenant isolation concurrency integration test
        run: npm run test:integration:rls-isolation

      - name: Amazon authoritative validation integration test
        run: npm run test:integration:amazon-authoritative-validation

      - name: Catalog completeness integration test
        run: npm run test:integration:catalog-completeness

      - name: Shopify productSet payload integration test
        run: npm run test:integration:shopify-product-set-payload

      - name: Shopify publication webhook integration test
        run: npm run test:integration:shopify-publication-webhook

      - name: Shopify runtime foundation integration test
        run: npm run test:integration:shopify-runtime-foundation

      - name: Outbound webhook integration test
        run: node apps/api/test/integration/outbound-webhooks.test.cjs

      - name: WooCommerce credential verification endpoint test (PIM#582)
        run: node apps/api/test/integration/woocommerce-credential-verification-endpoint.test.cjs

      - name: Catalog shared-read timeout classification — controlled reproduction (PIM#578)
        run: npm run test:integration:catalog-shared-read-timeout-classification

      - name: Product workflow edit-lock UI test (PIM#581)
        run: node apps/web/test/integration/product-workflow-edit-lock-ui.test.cjs

      - name: Plan usage SKU-meter tests (PIM#579)
        run: |
          node apps/api/test/integration/plan-usage-sku-definition.test.cjs
          node apps/web/test/integration/plan-usage-sku-meter-copy.test.cjs

      - name: Products workbench bulk-publish manual selection test (PIM#595)
        run: node apps/web/test/integration/products-workbench-bulk-publish-selection.test.cjs

      - name: Seam tests (RBAC parity, plan-limit coverage, error contract)
        run: |
          if [ -d "apps/api/test/seam" ] && [ -n "$(ls apps/api/test/seam/*.cjs 2>/dev/null)" ]; then
            npx jest apps/api/test/seam/ --no-coverage
          else
            echo "Seam test directory not present yet — skipping (add tests via fix/phase3-5-tests)"
          fi

      - name: Marketplace readiness contract tests
        run: |
          node apps/api/test/integration/marketplace-readiness-summary-contract.test.cjs
          node apps/web/test/integration/product-workbench-readiness-batch.test.cjs
          node apps/web/test/integration/product-detail-readiness-batch.test.cjs

      - name: Integration tests (parallel)
        run: npm run test:integration:parallel
        timeout-minutes: 10

  # ── E2E (Playwright) ──────────────────────────────────────────────────
  # Skipped when only non-app files change (scripts, workflows, docs).
  e2e:
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.e2e-relevant == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: "22"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pim1?schema=public
      DATABASE_URL_POOLED: postgresql://postgres:postgres@localhost:5432/pim1?schema=public
      DATABASE_URL_DIRECT: postgresql://postgres:postgres@localhost:5432/pim1?schema=public
      JWT_SECRET: pim1-ci-jwt-secret-minimum-length-32
      JWT_EXPIRY: 4h
      CREDENTIAL_ENCRYPTION_KEY_V1: pim1-ci-encryption-key-v1-minimum-32
      CREDENTIAL_ENCRYPTION_KEY_CURRENT_VERSION: "1"
      REDIS_URL: redis://localhost:6379
      R2_ACCOUNT_ID: local-ci
      R2_ACCESS_KEY_ID: local-ci
      R2_SECRET_ACCESS_KEY: local-ci
      R2_BUCKET_NAME: pim1-ci
      R2_PUBLIC_URL: https://example.com/pim1-ci
      APP_ENV: development
      AUTH_MODE: local
      FEATURE_REAL_SPAPI_VALIDATION: "false"
      QUEUE_BACKEND: memory
      QUEUE_WORKER_ENABLED: "true"
      PIM_AUTH_PASSWORD: vexa-pim-demo-password
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pim1
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pim1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install system redis-server (for npm ci postinstall)
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
          echo "REDISMS_SYSTEM_BINARY=$(command -v redis-server)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npm run prisma:generate

      - name: Prisma migrate deploy
        run: npx prisma migrate deploy --schema packages/db/prisma/schema.prisma

      - name: Build API
        run: npm run build --workspace @pim1/api

      - name: Build Web
        run: npm run build --workspace @pim1/web

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E smoke tests
        run: npm run test:e2e:smoke -- --project=chromium
        timeout-minutes: 12

      - name: E2E - Products workbench bulk-publish returnTo regression (PIM#596 follow-up)
        run: npx playwright test products-workbench-bulk-publish-return-to --project=chromium
        timeout-minutes: 10

      - name: E2E - Full UX journey (import → catalog → quality → bulk edit → mapping)
        run: npx playwright test journey-bulk-import-to-mapping --project=chromium
        timeout-minutes: 12
        continue-on-error: true

      - name: E2E - Shopify connector journey
        run: |
          npx playwright test \
            shopify-connector-managed-install \
            shopify-product-publish-journey \
            --project=chromium
        timeout-minutes: 15
        env:
          PLAYWRIGHT_ENABLE_SHOPIFY_STUB: "1"
          PIM_SHOPIFY_CLIENT_ID: ci-stub-client-id
          PIM_SHOPIFY_CLIENT_SECRET: ci-stub-client-secret
          PLAYWRIGHT_SHOPIFY_STORE_DOMAIN: ${{ secrets.PLAYWRIGHT_SHOPIFY_STORE_DOMAIN || 'demo-store.myshopify.com' }}
          PLAYWRIGHT_SHOPIFY_STORE_NAME: ${{ secrets.PLAYWRIGHT_SHOPIFY_STORE_NAME || 'Demo Store' }}
          PLAYWRIGHT_SHOPIFY_STORE_ID: ${{ secrets.PLAYWRIGHT_SHOPIFY_STORE_ID || 'gid://shopify/Shop/9001' }}
          PLAYWRIGHT_SHOPIFY_PUBLICATION_NAME: ${{ secrets.PLAYWRIGHT_SHOPIFY_PUBLICATION_NAME || 'Online Store' }}
          PLAYWRIGHT_SHOPIFY_PUBLICATION_COUNT_LABEL: ${{ secrets.PLAYWRIGHT_SHOPIFY_PUBLICATION_COUNT_LABEL || '1 publication target' }}
          PIM_SHOPIFY_ADMIN_API_BASE_URL: http://127.0.0.1:9090
