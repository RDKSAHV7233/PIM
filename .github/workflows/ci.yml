name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  # ── Gate: detect which areas of the codebase changed ──────────────────
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      e2e-relevant: ${{ steps.filter.outputs.e2e-relevant }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          token: ""
          filters: |
            backend:
              - 'apps/api/**'
              - 'packages/db/**'
              - 'scripts/**'
              - '.github/workflows/**'
              - 'package.json'
              - 'package-lock.json'
            e2e-relevant:
              - 'apps/**'
              - 'packages/**'
              - 'playwright*'
              - 'e2e/**'

  # ── Fast gate: lint + build (no DB, no Redis) ─────────────────────────
  # Runs on EVERY PR. Proves the code compiles. Frontend-only PRs stop here.
  build:
    needs: detect-changes
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: "22"
      DATABASE_URL: postgresql://unused:unused@localhost:5432/unused
      DATABASE_URL_POOLED: postgresql://unused:unused@localhost:5432/unused
      DATABASE_URL_DIRECT: postgresql://unused:unused@localhost:5432/unused
      JWT_SECRET: pim1-ci-jwt-secret-minimum-length-32
      JWT_EXPIRY: 4h
      CREDENTIAL_ENCRYPTION_KEY_V1: pim1-ci-encryption-key-v1-minimum-32
      CREDENTIAL_ENCRYPTION_KEY_CURRENT_VERSION: "1"
      REDIS_URL: redis://unused:6379
      R2_ACCOUNT_ID: local-ci
      R2_ACCESS_KEY_ID: local-ci
      R2_SECRET_ACCESS_KEY: local-ci
      R2_BUCKET_NAME: pim1-ci
      R2_PUBLIC_URL: https://example.com/pim1-ci
      APP_ENV: development
      AUTH_MODE: local
      FEATURE_REAL_SPAPI_VALIDATION: "false"
      QUEUE_BACKEND: memory
      QUEUE_WORKER_ENABLED: "true"
      PIM_AUTH_PASSWORD: vexa-pim-demo-password
      # redis-memory-server (a root devDependency, only used by
      # apps/api/test/integration/queue-durability.test.cjs, which this job never runs)
      # otherwise tries to download/compile a Redis Stack binary during npm ci's
      # postinstall. This is its own documented skip flag — no system redis-server needed.
      REDISMS_DISABLE_POSTINSTALL: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Security audit (fail on high+critical only)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Prisma generate
        run: npm run prisma:generate

      - name: Unsafe raw SQL comment guard
        env:
          CHECK_ONLY_CHANGED: "true"
          GIT_BASE_REF: ${{ github.event.pull_request.base.sha || 'HEAD~1' }}
        run: node scripts/check-unsafe-raw-comments.cjs

      - name: PR scope guard
        if: github.event_name == 'pull_request'
        env:
          GIT_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-pr-scope.cjs

      # VEXA-AI-001 governance validators and their fixture tests. These are DB-free and fast. A glob (not a
      # list) is used so a new validate-ai-* script is gated automatically instead of silently left out.
      - name: Backup failure alert path guard (a failed backup must never be silent)
        run: |
          node scripts/validate-ops-backup-alert-path.cjs
          node scripts/validate-ops-backup-alert-path.test.cjs

      - name: SEC-DB-RLS-001 call-site ratchet and restricted-role lane guard
        run: |
          node scripts/validate-sec-db-call-sites.cjs
          node scripts/validate-sec-db-call-sites.test.cjs
          node scripts/validate-sec-restricted-lane.cjs
          node scripts/validate-sec-restricted-lane.test.cjs
          node scripts/db-identity/lib.test.cjs
          node scripts/db-identity/tool.test.cjs
          node scripts/prisma-migrate-deploy.test.cjs

      - name: AI governance validators and fixture tests
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(scripts/validate-ai-*.cjs)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No scripts/validate-ai-*.cjs found; refusing to pass an empty gate."
            exit 1
          fi
          for file in "${files[@]}"; do
            echo "::group::${file}"
            node "${file}"
            echo "::endgroup::"
          done

      - name: Integration test coverage drift guard (PIM#754)
        run: node scripts/check-integration-test-coverage.cjs

      - name: Lint API
        run: npm run lint --workspace @pim1/api

      - name: Build API
        run: npm run build --workspace @pim1/api

      - name: OpenAPI spec freshness check
        run: npm run openapi:check

      - name: Build Web
        run: npm run build --workspace @pim1/web

      - name: DevOps contract tests
        run: |
          node scripts/check-pr-scope.test.cjs
          node scripts/check-integration-test-coverage.test.cjs
          node scripts/validate-ci-e2e-redis-postinstall.test.cjs
          node scripts/railway-deploy.test.cjs
          node scripts/resolve-deploy-base-sha.test.cjs
          node scripts/resolve-observability-database-url.test.cjs
          node apps/api/test/integration/internal-ops-alerting-contract.test.cjs
          node scripts/staging-internal-ops-summary-acceptance.test.cjs
          node scripts/staging-error-authority-ops-errors-acceptance.test.cjs
          node scripts/staging-connector-export-coverage.test.cjs
          node scripts/validate-deploy-staging-workflow.cjs
          node scripts/validate-e2e-staging-workflow.cjs
          node scripts/validate-daily-rollout-evidence-workflow.cjs
          node scripts/validate-staging-deploy-config.test.cjs
          node scripts/migrate-legacy-auth-password-hashes.test.cjs
          node scripts/p1-woo-credential-ownership-proof.test.cjs
          node scripts/sec-db-rls-001-probe.test.cjs
          node scripts/verify-auth-password-hash-coverage.test.cjs
          node scripts/sellable-sku-variantless-audit-report.test.cjs
          node scripts/validate-sellable-sku-variantless-production-audit-workflow.cjs
          node scripts/sellable-sku-variantless-backfill.test.cjs
          node scripts/validate-sellable-sku-variantless-backfill-workflow.cjs
          node apps/api/test/integration/railway-api-package-contract.test.cjs
          node apps/web/test/integration/railway-web-runtime-contract.test.cjs

      - name: Middleware Server Action session-expired test (PIM#601)
        run: node apps/web/test/integration/middleware-server-action-session-expired.test.cjs

      - name: Plan comparison limit-formatting test (PIM#610)
        run: node apps/web/test/integration/plan-comparison-limit-formatting.test.cjs

      - name: Admin users route contract test (PIM#631)
        run: node apps/web/test/integration/admin-users-route-contract.test.cjs

      - name: Public signup web flow readiness-timeout guard (PIM#777)
        run: node apps/web/test/integration/public-signup-web-flow-readiness-timeout.test.cjs

      - name: Web integration DB-free suite (PIM#754)
        run: node scripts/run-web-integration-db-free.cjs --timeout=30

  # ── Connector network transport (Node 22 + 24) ────────────────────────
  # The pinned transport pairs the npm undici Agent with undici's OWN fetch. Mixing an
  # npm Agent with Node's bundled global fetch breaks across undici majors, so the real
  # local-TLS pinning specs run on both the CI baseline (22) and the production
  # runtime (24). Only these specs run here; the rest of CI stays on 22.
  # REQUIRE_FULL_LOOPBACK makes missing loopback aliases (127.0.0.2, ::1) fail the run
  # instead of silently weakening the "no connection to an unvalidated address" proof.
  connector-network-transport:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    env:
      REDISMS_DISABLE_POSTINSTALL: "true"
      REQUIRE_FULL_LOOPBACK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Connector network transport specs
        working-directory: apps/api
        run: >-
          npx jest --config jest.config.js
          src/common/security
          src/connector-framework/connector-http-client
          src/connectors/connector-transport-wiring
          src/outbound-webhooks/outbound-webhooks.pinning

  # ── Backend tests (DB + Redis required) ───────────────────────────────
  # Skipped when only frontend files change on a PR.
  backend-tests:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: "22"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pim1?schema=public
      DATABASE_URL_POOLED: postgresql://postgres:postgres@localhost:5432/pim1?schema=public
      DATABASE_URL_DIRECT: postgresql://postgres:postgres@localhost:5432/pim1?schema=public
      JWT_SECRET: pim1-ci-jwt-secret-minimum-length-32
      JWT_EXPIRY: 4h
      CREDENTIAL_ENCRYPTION_KEY_V1: pim1-ci-encryption-key-v1-minimum-32
      CREDENTIAL_ENCRYPTION_KEY_CURRENT_VERSION: "1"
      REDIS_URL: redis://localhost:6379
      R2_ACCOUNT_ID: local-ci
      R2_ACCESS_KEY_ID: local-ci
      R2_SECRET_ACCESS_KEY: local-ci
      R2_BUCKET_NAME: pim1-ci
      R2_PUBLIC_URL: https://example.com/pim1-ci
      APP_ENV: development
      AUTH_MODE: local
      FEATURE_REAL_SPAPI_VALIDATION: "false"
      QUEUE_BACKEND: memory
      QUEUE_WORKER_ENABLED: "true"
      PIM_AUTH_PASSWORD: vexa-pim-demo-password
      # redis-memory-server (a root devDependency, only used by
      # apps/api/test/integration/queue-durability.test.cjs, which isn't wired into
      # any step below) otherwise tries to download/compile a Redis Stack binary
      # during npm ci's postinstall. This is its own documented skip flag — no
      # system redis-server needed. The live redis:7 service below is unrelated:
      # it's the real Redis this job's tests connect to via REDIS_URL.
      REDISMS_DISABLE_POSTINSTALL: "true"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pim1
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pim1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npm run prisma:generate

      - name: Lint API
        run: npm run lint --workspace @pim1/api

      - name: Build API
        run: npm run build --workspace @pim1/api

      - name: Prisma migrate deploy + RLS verification
        run: |
          npx prisma migrate deploy --schema packages/db/prisma/schema.prisma
          node scripts/verify-tenant-rls.cjs

      - name: Unit tests
        run: npm run test:unit --workspace @pim1/api

      - name: Tenant isolation concurrency integration test
        run: npm run test:integration:rls-isolation

      - name: AI provider budget lifecycle integration test (real PostgreSQL)
        run: npm run test:integration:ai-provider-budget-lifecycle

      - name: Amazon authoritative validation integration test
        run: npm run test:integration:amazon-authoritative-validation

      - name: Catalog completeness integration test
        run: npm run test:integration:catalog-completeness

      - name: Shopify productSet payload integration test
        run: npm run test:integration:shopify-product-set-payload

      - name: Shopify publication webhook integration test
        run: npm run test:integration:shopify-publication-webhook

      - name: Shopify runtime foundation integration test
        run: npm run test:integration:shopify-runtime-foundation

      - name: Shopify vNext mutation safety integration test
        run: npm run test:integration:shopify-vnext-mutation-safety

      - name: Outbound webhook integration test
        run: node apps/api/test/integration/outbound-webhooks.test.cjs

      - name: WooCommerce credential verification endpoint test (PIM#582)
        run: node apps/api/test/integration/woocommerce-credential-verification-endpoint.test.cjs

      - name: Catalog shared-read timeout classification — controlled reproduction (PIM#578)
        run: npm run test:integration:catalog-shared-read-timeout-classification

      - name: Product workflow edit-lock UI test (PIM#581)
        run: node apps/web/test/integration/product-workflow-edit-lock-ui.test.cjs

      - name: Plan usage SKU-meter tests (PIM#579)
        run: |
          node apps/api/test/integration/plan-usage-sku-definition.test.cjs
          node apps/web/test/integration/plan-usage-sku-meter-copy.test.cjs

      - name: Products workbench bulk-publish manual selection test (PIM#595)
        run: node apps/web/test/integration/products-workbench-bulk-publish-selection.test.cjs

      - name: Bulk-publish timeout ambiguous-outcome test (PIM#693)
        run: node apps/web/test/integration/bulk-publish-timeout-ambiguous-outcome.test.cjs

      - name: Media readiness channel-ineligible label test (PIM#644)
        run: node apps/web/test/integration/product-media-readiness-channel-ineligible-label.test.cjs

      - name: Error Authority mutation-path coverage matrix (PIM#651)
        run: node apps/api/test/integration/error-authority-mutation-path-coverage.test.cjs

      - name: Seam tests (RBAC parity, plan-limit coverage, error contract)
        run: |
          if [ -d "apps/api/test/seam" ] && [ -n "$(ls apps/api/test/seam/*.cjs 2>/dev/null)" ]; then
            npx jest apps/api/test/seam/ --no-coverage
          else
            echo "Seam test directory not present yet — skipping (add tests via fix/phase3-5-tests)"
          fi

      - name: Marketplace readiness contract tests
        run: |
          node apps/api/test/integration/marketplace-readiness-summary-contract.test.cjs
          node apps/web/test/integration/product-workbench-readiness-batch.test.cjs
          node apps/web/test/integration/product-detail-readiness-batch.test.cjs

      - name: MFA login DB-backed proof test (PIM#754)
        run: node apps/web/test/integration/mfa-login-db-proof.test.cjs

      - name: Public signup web flow DB-backed test (PIM#777)
        run: node apps/web/test/integration/public-signup-web-flow.test.cjs
        timeout-minutes: 8

      - name: Integration tests (parallel)
        run: npm run test:integration:parallel
        timeout-minutes: 10

  # ── E2E (Playwright) ──────────────────────────────────────────────────
  # Skipped when only non-app files change (scripts, workflows, docs).
  # ── SEC-DB-RLS-001: integration tests with the API on a restricted database role ─────
  # The API connects as a NOSUPERUSER, NOBYPASSRLS, non-owner role while every test keeps its admin connection for seeding and
  # inspection. The lane is required and ratcheting: scripts/restricted-role-lane.v1.json lists the tests and the tracked
  # expected failures (each names the migration PR M1..M6 that fixes it). A new failure, a listed test that now passes, or a lane
  # that cannot prove the API used the restricted role all fail this job.
  restricted-role-lane:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: "22"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pim1?schema=public
      DATABASE_URL_POOLED: postgresql://postgres:postgres@localhost:5432/pim1?schema=public
      DATABASE_URL_DIRECT: postgresql://postgres:postgres@localhost:5432/pim1?schema=public
      JWT_SECRET: pim1-ci-jwt-secret-minimum-length-32
      JWT_EXPIRY: 4h
      CREDENTIAL_ENCRYPTION_KEY_V1: pim1-ci-encryption-key-v1-minimum-32
      CREDENTIAL_ENCRYPTION_KEY_CURRENT_VERSION: "1"
      REDIS_URL: redis://localhost:6379
      R2_ACCOUNT_ID: local-ci
      R2_ACCESS_KEY_ID: local-ci
      R2_SECRET_ACCESS_KEY: local-ci
      R2_BUCKET_NAME: pim1-ci
      R2_PUBLIC_URL: https://example.com/pim1-ci
      APP_ENV: development
      AUTH_MODE: local
      FEATURE_REAL_SPAPI_VALIDATION: "false"
      QUEUE_BACKEND: memory
      QUEUE_WORKER_ENABLED: "true"
      PIM_AUTH_PASSWORD: vexa-pim-demo-password
      # redis-memory-server (a root devDependency, only used by
      # apps/api/test/integration/queue-durability.test.cjs, which isn't wired into
      # any step below) otherwise tries to download/compile a Redis Stack binary
      # during npm ci's postinstall. This is its own documented skip flag — no
      # system redis-server needed. The live redis:7 service below is unrelated:
      # it's the real Redis this job's tests connect to via REDIS_URL.
      REDISMS_DISABLE_POSTINSTALL: "true"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pim1
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pim1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npm run prisma:generate

      - name: Build API
        run: npm run build --workspace @pim1/api

      - name: Prisma migrate deploy (admin identity)
        run: npx prisma migrate deploy --schema packages/db/prisma/schema.prisma

      - name: Create the restricted runtime role (explicit grants, asserted)
        run: node scripts/ci/create-restricted-runtime-role.cjs

      - name: Run integration tests with the API on the restricted role
        run: node scripts/run-restricted-role-lane.cjs

  # SEC-DB-RLS-001 I1: rehearses the database identity model (migrator, runtime, backup, ops) against a database that reproduces the
  # production ownership split. Rehearsal only: it never touches production and never reads a production credential.
  # PostgreSQL 16 and 18: production runs 18. The server runs as a plain container (not a service) so pg_dump and pg_restore run inside
  # it at exactly the server's version; the job fails if they cannot run, it never skips the backup proof.
  db-identity-rehearsal:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "18"]
    env:
      NODE_VERSION: "22"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pim1?schema=public
      REHEARSAL_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
      REHEARSAL_DOCKER_CONTAINER: pg-rehearsal
      # redis-memory-server (a root devDependency) otherwise compiles a Redis binary during npm ci; this rehearsal does not use Redis.
      REDISMS_DISABLE_POSTINSTALL: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npm run prisma:generate

      - name: Start PostgreSQL ${{ matrix.postgres }}
        run: |
          docker run -d --name pg-rehearsal -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=pim1 -p 5432:5432 postgres:${{ matrix.postgres }}
          for i in $(seq 1 30); do
            docker exec pg-rehearsal pg_isready -U postgres -d pim1 && break
            sleep 2
          done
          docker exec pg-rehearsal pg_isready -U postgres -d pim1
          docker exec pg-rehearsal pg_dump --version
          docker exec pg-rehearsal pg_restore --version

      # The read-only production probe is run on production (PostgreSQL 18), so it is proved here on both 16 and 18 against a
      # production-shaped database before it is trusted. It cleans up its own database and roles, so it runs first and leaves
      # the cluster as the rehearsal expects it.
      - name: Prove the SEC-DB-RLS-001 read-only probe on a production-shaped database
        env:
          PROBE_PROOF_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
          CHECKPOINT_DISABLE: "1"
        run: node scripts/sec-db-rls-001-probe-proof.cjs

      - name: Rehearse the database identity model
        run: node scripts/db-identity/rehearse.cjs

  e2e:
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.e2e-relevant == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: "22"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pim1?schema=public
      DATABASE_URL_POOLED: postgresql://postgres:postgres@localhost:5432/pim1?schema=public
      DATABASE_URL_DIRECT: postgresql://postgres:postgres@localhost:5432/pim1?schema=public
      JWT_SECRET: pim1-ci-jwt-secret-minimum-length-32
      JWT_EXPIRY: 4h
      CREDENTIAL_ENCRYPTION_KEY_V1: pim1-ci-encryption-key-v1-minimum-32
      CREDENTIAL_ENCRYPTION_KEY_CURRENT_VERSION: "1"
      REDIS_URL: redis://localhost:6379
      R2_ACCOUNT_ID: local-ci
      R2_ACCESS_KEY_ID: local-ci
      R2_SECRET_ACCESS_KEY: local-ci
      R2_BUCKET_NAME: pim1-ci
      R2_PUBLIC_URL: https://example.com/pim1-ci
      APP_ENV: development
      AUTH_MODE: local
      FEATURE_REAL_SPAPI_VALIDATION: "false"
      QUEUE_BACKEND: memory
      QUEUE_WORKER_ENABLED: "true"
      PIM_AUTH_PASSWORD: vexa-pim-demo-password
      # E2E uses the live redis:7 service below. Prevent redis-memory-server's
      # install hook from downloading or compiling a second Redis binary.
      REDISMS_DISABLE_POSTINSTALL: "true"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pim1
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pim1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npm run prisma:generate

      - name: Prisma migrate deploy
        run: npx prisma migrate deploy --schema packages/db/prisma/schema.prisma

      - name: Build API
        run: npm run build --workspace @pim1/api

      - name: Build Web
        run: npm run build --workspace @pim1/web

      - name: Disable unrelated Google Chrome apt source
        run: |
          for source in /etc/apt/sources.list.d/google-chrome*.list; do
            [ -f "$source" ] || continue
            sudo sed -i '\|dl.google.com/linux/chrome|d' "$source"
          done

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E smoke tests
        run: npm run test:e2e:smoke -- --project=chromium
        timeout-minutes: 12

      - name: E2E - Products workbench bulk-publish returnTo regression (PIM#596 follow-up)
        run: npx playwright test products-workbench-bulk-publish-return-to --project=chromium
        timeout-minutes: 10

      - name: E2E - Full UX journey (import → catalog → quality → bulk edit → mapping)
        run: npx playwright test journey-bulk-import-to-mapping --project=chromium
        timeout-minutes: 12

      - name: E2E - Bulk edit non-writer role access (PIM#689)
        run: npx playwright test bulk-edit-role-access --project=chromium
        timeout-minutes: 10

      - name: E2E - Shopify connector journey
        run: |
          npx playwright test \
            shopify-connector-managed-install \
            shopify-product-publish-journey \
            --project=chromium
        timeout-minutes: 15
        env:
          PLAYWRIGHT_ENABLE_SHOPIFY_STUB: "1"
          PIM_SHOPIFY_CLIENT_ID: ci-stub-client-id
          PIM_SHOPIFY_CLIENT_SECRET: ci-stub-client-secret
          PLAYWRIGHT_SHOPIFY_STORE_DOMAIN: ${{ secrets.PLAYWRIGHT_SHOPIFY_STORE_DOMAIN || 'demo-store.myshopify.com' }}
          PLAYWRIGHT_SHOPIFY_STORE_NAME: ${{ secrets.PLAYWRIGHT_SHOPIFY_STORE_NAME || 'Demo Store' }}
          PLAYWRIGHT_SHOPIFY_STORE_ID: ${{ secrets.PLAYWRIGHT_SHOPIFY_STORE_ID || 'gid://shopify/Shop/9001' }}
          PLAYWRIGHT_SHOPIFY_PUBLICATION_NAME: ${{ secrets.PLAYWRIGHT_SHOPIFY_PUBLICATION_NAME || 'Online Store' }}
          PLAYWRIGHT_SHOPIFY_PUBLICATION_COUNT_LABEL: ${{ secrets.PLAYWRIGHT_SHOPIFY_PUBLICATION_COUNT_LABEL || '1 publication target' }}
          PIM_SHOPIFY_ADMIN_API_BASE_URL: http://127.0.0.1:9090
