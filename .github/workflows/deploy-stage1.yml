name: Deploy Stage 1

on:
  workflow_dispatch:
    inputs:
      staging_url:
        description: "Stage 1 API base URL (e.g. https://<service>.onrender.com)"
        required: true
        type: string

jobs:
  deploy-stage1:
    runs-on: ubuntu-latest
    env:
      APP_ENV: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Validate Stage 1 deploy contract
        shell: bash
        env:
          APP_ENV: staging
          STAGING_BASE_URL: ${{ inputs.staging_url }}
          STAGING_WEB_URL: ${{ secrets.STAGE1_WEB_URL }}
          STAGING_EXPECT_PUBLIC_SIGNUP_ENABLED: "false"
        run: |
          node scripts/validate-staging-deploy-config.cjs

      - name: Apply migrations
        shell: bash
        env:
          DATABASE_URL_DIRECT: ${{ secrets.STAGE1_DATABASE_URL_DIRECT }}
          DATABASE_URL: ${{ secrets.STAGE1_DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL_DIRECT}" ] && [ -z "${DATABASE_URL}" ]; then
            echo "Missing STAGE1_DATABASE_URL_DIRECT or STAGE1_DATABASE_URL secret."
            exit 1
          fi
          npm run prisma:migrate:deploy

      - name: Staging health smoke test
        shell: bash
        env:
          STAGING_URL: ${{ inputs.staging_url }}
        run: |
          response="$(curl -fsS "${STAGING_URL}/api/v1/health")"
          echo "health=${response}"
          echo "${response}" | grep -q "\"status\":\"ok\""

      - name: Post-deploy verification
        shell: bash
        env:
          STAGING_BASE_URL: ${{ inputs.staging_url }}
          STAGING_WEB_URL: ${{ secrets.STAGE1_WEB_URL }}
          STAGING_SMOKE_WORKSPACE: ${{ secrets.STAGE1_SMOKE_WORKSPACE }}
          STAGING_SMOKE_USER: ${{ secrets.STAGE1_SMOKE_USER }}
          STAGING_SMOKE_PASSWORD: ${{ secrets.STAGE1_SMOKE_PASSWORD }}
          STAGING_EXPECTED_ENV: staging
          STAGING_VALIDATE_NON_ADMIN: "true"
        run: |
          if [ -z "${STAGING_SMOKE_WORKSPACE}" ]; then
            echo "Missing STAGE1_SMOKE_WORKSPACE secret for post-deploy verification."
            exit 1
          fi
          node scripts/staging-postdeploy-check.cjs
