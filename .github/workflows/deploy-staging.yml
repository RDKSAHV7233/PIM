name: Deploy Staging

on:
  workflow_dispatch:
    inputs:
      deploy_targets:
        description: "Optional deploy target override: api, web, or api,web"
        required: false
        type: string
      rollback_snapshot:
        description: "Optional: capture Shopify vNext rollback snapshot after deploy"
        required: false
        default: false
        type: boolean
      rollback_release_sha:
        description: "Release SHA for optional Shopify vNext rollback snapshot"
        required: false
        type: string
      rollback_tenant:
        description: "Tenant key for optional Shopify vNext rollback snapshot"
        required: false
        type: string
      rollback_connector:
        description: "Connector slug for optional Shopify vNext rollback snapshot"
        required: false
        type: string
      rollback_installation:
        description: "Installation ID for optional Shopify vNext rollback snapshot"
        required: false
        type: string
      rollback_product:
        description: "PIM product ID for optional Shopify vNext rollback snapshot"
        required: false
        type: string
      rollback_shopify_product_gid:
        description: "Shopify Product GID for optional Shopify vNext rollback snapshot"
        required: false
        type: string
  push:
    branches:
      - main
    paths-ignore:
      - docs/execution/gates/**
      - docs/execution/rollout/**

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: staging
    permissions:
      contents: read
      actions: read
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      APP_ENV: staging
      # Deployment uses Railway Redis at runtime. Prevent redis-memory-server's
      # npm install hook from downloading or compiling a local Redis binary.
      REDISMS_DISABLE_POSTINSTALL: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply migrations
        shell: bash
        env:
          DATABASE_URL_DIRECT: ${{ secrets.STAGING_DATABASE_URL_DIRECT }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          # SEC-DB-RLS-001 7.9a, opt-in: while this secret is unset the value is empty and nothing changes. When a person creates the
          # vexa_migrator credential and stores it, the migrations run as that identity and the explicit grants follow immediately.
          MIGRATION_DATABASE_URL: ${{ secrets.STAGING_MIGRATION_DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL_DIRECT}" ] && [ -z "${DATABASE_URL}" ]; then
            echo "Missing STAGING_DATABASE_URL_DIRECT or STAGING_DATABASE_URL secret for migrations."
            exit 1
          fi
          npm run prisma:migrate:deploy

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Resolve observability database URL
        id: resolve_observability_database_url
        shell: bash
        env:
          OBSERVABILITY_DATABASE_URL: ${{ secrets.OBSERVABILITY_DATABASE_URL }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_API_SERVICE: ${{ secrets.RAILWAY_API_SERVICE || 'Vexa API' }}
          RAILWAY_API_SERVICE_ID: ${{ secrets.RAILWAY_API_SERVICE_ID }}
          RAILWAY_WEB_SERVICE: ${{ secrets.RAILWAY_WEB_SERVICE || 'App Vexa' }}
          RAILWAY_WEB_SERVICE_ID: ${{ secrets.RAILWAY_WEB_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_ENVIRONMENT_NAME: Production
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          STAGING_WEB_URL: ${{ secrets.STAGING_WEB_URL }}
        run: |
          node scripts/resolve-observability-database-url.cjs

      - name: Apply observability migrations
        shell: bash
        env:
          OBSERVABILITY_DATABASE_URL: ${{ steps.resolve_observability_database_url.outputs.observability_database_url }}
        run: |
          if [ -z "${OBSERVABILITY_DATABASE_URL}" ]; then
            echo "Missing OBSERVABILITY_DATABASE_URL secret for Error Authority migrations."
            exit 1
          fi
          npm run prisma:migrate:deploy --workspace @pim1/observability-db

      - name: Seed tax regimes
        shell: bash
        env:
          DATABASE_URL_DIRECT: ${{ secrets.STAGING_DATABASE_URL_DIRECT }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          # SEC-DB-RLS-001 8.1b, opt-in: tax_regimes is read-only for the restricted runtime, so once the vexa_migrator credential exists
          # the seed writes as that identity (verified by the script). While the secret is unset the value is empty and nothing changes.
          MIGRATION_DATABASE_URL: ${{ secrets.STAGING_MIGRATION_DATABASE_URL }}
        run: |
          node scripts/seed-tax-regimes.cjs

      - name: Sync smoke-test identity password
        shell: bash
        env:
          DATABASE_URL_DIRECT: ${{ secrets.STAGING_DATABASE_URL_DIRECT }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          RESET_IDENTITY_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
          STAGING_SMOKE_TENANT_ID: ${{ secrets.STAGING_SMOKE_TENANT_ID }}
          STAGING_SMOKE_USER: ${{ secrets.STAGING_SMOKE_USER }}
        run: |
          # Keep the dedicated staging smoke identity's stored password hash in
          # sync with STAGING_SMOKE_PASSWORD. This is targeted to one named user;
          # the legacy shared-password backfill is intentionally not used.
          if [ -z "${STAGING_SMOKE_USER}" ]; then
            echo "Missing STAGING_SMOKE_USER secret — cannot target smoke identity password sync."
            exit 1
          fi
          if [ -z "${STAGING_SMOKE_TENANT_ID}" ]; then
            echo "Missing STAGING_SMOKE_TENANT_ID secret — cannot target smoke identity password sync."
            exit 1
          fi
          node scripts/reset-smoke-identity-password.cjs --tenant "${STAGING_SMOKE_TENANT_ID}" --user "${STAGING_SMOKE_USER}"

      - name: Verify auth password hash coverage
        shell: bash
        env:
          DATABASE_URL_DIRECT: ${{ secrets.STAGING_DATABASE_URL_DIRECT }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL_DIRECT}" ] && [ -z "${DATABASE_URL}" ]; then
            echo "Missing STAGING_DATABASE_URL_DIRECT or STAGING_DATABASE_URL secret for auth password hash coverage."
            exit 1
          fi
          node scripts/verify-auth-password-hash-coverage.cjs

      - name: Build API
        run: npm run build --workspace @pim1/api

      - name: Build Web
        run: npm run build --workspace @pim1/web

      - name: Resolve staging API URL
        id: resolve_staging_api_url
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_API_SERVICE || 'Vexa API' }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_API_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_ENVIRONMENT_NAME: Production
          FALLBACK_STAGING_API_URL: ${{ secrets.STAGING_BASE_URL }}
        run: |
          resolved_api_url="$(node scripts/resolve-railway-service-url.cjs 2>/dev/null || true)"
          if [ -z "${resolved_api_url}" ]; then
            resolved_api_url="${FALLBACK_STAGING_API_URL}"
          fi
          if [ -z "${resolved_api_url}" ]; then
            echo "Could not resolve staging API URL from Railway and no STAGING_BASE_URL secret fallback is configured."
            exit 1
          fi
          echo "api_url=${resolved_api_url}" >> "$GITHUB_OUTPUT"

      - name: Resolve last successful deploy base (diff base for deploy targets)
        id: resolve_deploy_base
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          base_sha="$(node scripts/resolve-deploy-base-sha.cjs || true)"
          echo "deploy_base_sha=${base_sha}" >> "$GITHUB_OUTPUT"
          echo "Deploy diff base: ${base_sha:-<none: deploying both services>}"

      - name: Deploy to staging
        timeout-minutes: 45
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_API_SERVICE: ${{ secrets.RAILWAY_API_SERVICE || 'Vexa API' }}
          RAILWAY_WEB_SERVICE: ${{ secrets.RAILWAY_WEB_SERVICE || 'App Vexa' }}
          RAILWAY_API_SERVICE_ID: ${{ secrets.RAILWAY_API_SERVICE_ID }}
          RAILWAY_WEB_SERVICE_ID: ${{ secrets.RAILWAY_WEB_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_ENVIRONMENT_NAME: Production
          RAILWAY_DEPLOY_TARGETS: ${{ inputs.deploy_targets }}
          DATABASE_URL_POOLED: ${{ secrets.STAGING_DATABASE_URL }}
          DATABASE_URL_DIRECT: ${{ secrets.STAGING_DATABASE_URL_DIRECT }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_BASE_URL: ${{ steps.resolve_staging_api_url.outputs.api_url }}
          STAGING_WEB_URL: ${{ secrets.STAGING_WEB_URL }}
          DEPLOY_BASE_SHA: ${{ steps.resolve_deploy_base.outputs.deploy_base_sha }}
          GITHUB_SHA: ${{ github.sha }}
          ERROR_AUTHORITY_RELEASE: ${{ github.sha }}
          ERROR_AUTHORITY_INGEST_TOKEN: ${{ secrets.ERROR_AUTHORITY_INGEST_TOKEN }}
          RAILWAY_DEPLOY_RETRIES: "1"
          RAILWAY_DEPLOY_TIMEOUT_MS: "2400000"
          RAILWAY_DEPLOY_RETRY_DELAY_MS: "10000"
        run: |
          node scripts/railway-deploy.cjs

      - name: Resolve staging web URL
        id: resolve_staging_web_url
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_WEB_SERVICE: ${{ secrets.RAILWAY_WEB_SERVICE || 'App Vexa' }}
          RAILWAY_WEB_SERVICE_ID: ${{ secrets.RAILWAY_WEB_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_ENVIRONMENT_NAME: Production
          FALLBACK_STAGING_WEB_URL: ${{ secrets.STAGING_WEB_URL }}
        run: |
          resolved_web_url="$(node scripts/resolve-railway-service-url.cjs 2>/dev/null || true)"
          if [ -z "${resolved_web_url}" ]; then
            resolved_web_url="${FALLBACK_STAGING_WEB_URL}"
          fi
          if [ -z "${resolved_web_url}" ]; then
            echo "Could not resolve staging web URL from Railway and no STAGING_WEB_URL secret fallback is configured."
            exit 1
          fi
          echo "web_url=${resolved_web_url}" >> "$GITHUB_OUTPUT"

      - name: Staging smoke test
        shell: bash
        env:
          STAGING_BASE_URL: ${{ steps.resolve_staging_api_url.outputs.api_url }}
        run: |
          if [ -z "${STAGING_BASE_URL}" ]; then
            echo "Missing STAGING_BASE_URL secret for smoke tests."
            exit 1
          fi
          for attempt in $(seq 1 30); do
            if response="$(curl -fsS --max-time 20 "${STAGING_BASE_URL}/api/v1/health/ready")"; then
              echo "ready=${response}"
              echo "${response}" | grep -q "\"status\":\"ready\""
              echo "Readiness confirmed on attempt ${attempt}/30."
              exit 0
            fi
            echo "::warning::Staging readiness probe attempt ${attempt}/30 failed; waiting for Railway readiness."
            sleep 10
          done
          echo "Staging did not become ready after 30 attempts."
          exit 1

      - name: Cleanup failed BullMQ jobs
        continue-on-error: true
        shell: bash
        env:
          STAGING_BASE_URL: ${{ steps.resolve_staging_api_url.outputs.api_url }}
          STAGING_SMOKE_WORKSPACE: ${{ secrets.STAGING_SMOKE_WORKSPACE }}
          STAGING_SMOKE_USER: ${{ secrets.STAGING_SMOKE_USER }}
          STAGING_SMOKE_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
        run: |
          if [ -z "${STAGING_BASE_URL}" ] || [ -z "${STAGING_SMOKE_USER}" ]; then
            echo "Skipping BullMQ cleanup — missing staging secrets."
            exit 0
          fi
          login_response="$(curl -sS "${STAGING_BASE_URL}/api/v1/auth/login" \
            -H 'Content-Type: application/json' \
            -d "{\"workspaceSlug\":\"${STAGING_SMOKE_WORKSPACE}\",\"userId\":\"${STAGING_SMOKE_USER}\",\"password\":\"${STAGING_SMOKE_PASSWORD}\"}")" || true
          token="$(echo "${login_response}" | jq -r '.token // .accessToken // empty')"
          if [ -z "${token}" ]; then
            echo "::warning::Could not obtain admin token for BullMQ cleanup."
            exit 0
          fi
          cleanup="$(curl -fsS "${STAGING_BASE_URL}/api/v1/queue/cleanup-failed" \
            -X POST -H "Authorization: Bearer ${token}" -H 'Content-Type: application/json')"
          echo "cleanup=${cleanup}"

      - name: Staging post-deploy verification (auth + trust boundary)
        shell: bash
        env:
          STAGING_BASE_URL: ${{ steps.resolve_staging_api_url.outputs.api_url }}
          STAGING_WEB_URL: ${{ steps.resolve_staging_web_url.outputs.web_url }}
          STAGING_SMOKE_WORKSPACE: ${{ secrets.STAGING_SMOKE_WORKSPACE }}
          STAGING_SMOKE_USER: ${{ secrets.STAGING_SMOKE_USER }}
          STAGING_SMOKE_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
          STAGING_EXPECTED_ENV: staging
          STAGING_VALIDATE_NON_ADMIN: "true"
        run: |
          if [ -z "${STAGING_SMOKE_WORKSPACE}" ]; then
            echo "Missing STAGING_SMOKE_WORKSPACE secret for post-deploy verification."
            exit 1
          fi
          if [ -z "${STAGING_WEB_URL}" ]; then
            echo "Missing STAGING_WEB_URL secret for post-deploy verification."
            exit 1
          fi
          node scripts/staging-postdeploy-check.cjs

      - name: Internal Ops Summary staging acceptance
        shell: bash
        env:
          STAGING_BASE_URL: ${{ steps.resolve_staging_api_url.outputs.api_url }}
          STAGING_WEB_URL: ${{ steps.resolve_staging_web_url.outputs.web_url }}
          STAGING_SMOKE_WORKSPACE: ${{ secrets.STAGING_SMOKE_WORKSPACE }}
          STAGING_SMOKE_USER: ${{ secrets.STAGING_SMOKE_USER }}
          STAGING_SMOKE_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
          OPS_SUMMARY_ACCEPTANCE_OUTPUT: .run-logs/internal-ops-summary-acceptance-${{ github.run_id }}.json
        run: |
          node scripts/staging-internal-ops-summary-acceptance.cjs

      - name: Internal Ops Errors staging acceptance
        shell: bash
        env:
          STAGING_BASE_URL: ${{ steps.resolve_staging_api_url.outputs.api_url }}
          STAGING_WEB_URL: ${{ steps.resolve_staging_web_url.outputs.web_url }}
          STAGING_SMOKE_WORKSPACE: ${{ secrets.STAGING_SMOKE_WORKSPACE }}
          STAGING_SMOKE_USER: ${{ secrets.STAGING_SMOKE_USER }}
          STAGING_SMOKE_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
          ERROR_AUTHORITY_INGEST_TOKEN: ${{ secrets.ERROR_AUTHORITY_INGEST_TOKEN }}
          ERROR_AUTHORITY_RELEASE: ${{ github.sha }}
          OPS_ERRORS_ACCEPTANCE_OUTPUT: .run-logs/internal-ops-errors-acceptance-${{ github.run_id }}.json
        run: |
          node scripts/staging-error-authority-ops-errors-acceptance.cjs

      - name: Dump open P0/P1 issue records (safe fields)
        shell: bash
        env:
          STAGING_BASE_URL: ${{ steps.resolve_staging_api_url.outputs.api_url }}
          STAGING_SMOKE_WORKSPACE: ${{ secrets.STAGING_SMOKE_WORKSPACE }}
          STAGING_SMOKE_USER: ${{ secrets.STAGING_SMOKE_USER }}
          STAGING_SMOKE_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
          P0P1_OPEN_ISSUES_OUTPUT: .run-logs/p0p1-open-issues-${{ github.run_id }}.json
        run: |
          node scripts/staging-p0p1-open-issues-dump.cjs

      - name: Public signup smoke check
        id: signup_check
        continue-on-error: true
        shell: bash
        env:
          STAGING_BASE_URL: ${{ steps.resolve_staging_api_url.outputs.api_url }}
          STAGING_WEB_URL: ${{ steps.resolve_staging_web_url.outputs.web_url }}
          STAGING_EXPECT_PUBLIC_SIGNUP_ENABLED: ${{ secrets.STAGING_EXPECT_PUBLIC_SIGNUP_ENABLED }}
          STAGING_EXPECTED_ENV: staging
        run: |
          if [ -z "${STAGING_BASE_URL}" ]; then
            echo "Missing STAGING_BASE_URL secret for public signup smoke check."
            exit 1
          fi
          node scripts/staging-public-signup-check.cjs

      - name: Warn on signup check mismatch
        if: steps.signup_check.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::Public signup smoke check failed — STAGING_EXPECT_PUBLIC_SIGNUP_ENABLED may not match the live staging state. Fix: set the secret to match the actual signup availability (ops runbook item #8)."

      - name: E2E smoke - post-deploy verification
        shell: bash
        env:
          STAGING_BASE_URL: ${{ steps.resolve_staging_api_url.outputs.api_url }}
          STAGING_SMOKE_WORKSPACE: ${{ secrets.STAGING_SMOKE_WORKSPACE }}
          STAGING_SMOKE_USER: ${{ secrets.STAGING_SMOKE_USER }}
          STAGING_SMOKE_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
          STAGING_SMOKE_TENANT_ID: ${{ secrets.STAGING_SMOKE_TENANT_ID }}
          STAGING_VIEWER_WORKSPACE: ${{ secrets.STAGING_VIEWER_WORKSPACE }}
          STAGING_VIEWER_USER: ${{ secrets.STAGING_VIEWER_USER }}
          STAGING_VIEWER_PASSWORD: ${{ secrets.STAGING_VIEWER_PASSWORD }}
          STAGING_EDITOR_WORKSPACE: ${{ secrets.STAGING_EDITOR_WORKSPACE }}
          STAGING_EDITOR_USER: ${{ secrets.STAGING_EDITOR_USER }}
          STAGING_EDITOR_PASSWORD: ${{ secrets.STAGING_EDITOR_PASSWORD }}
          STAGING_REVIEWER_WORKSPACE: ${{ secrets.STAGING_REVIEWER_WORKSPACE }}
          STAGING_REVIEWER_USER: ${{ secrets.STAGING_REVIEWER_USER }}
          STAGING_REVIEWER_PASSWORD: ${{ secrets.STAGING_REVIEWER_PASSWORD }}
          USE_CURL_SHIM: "false"
          E2E_SMOKE: "true"
        run: |
          mkdir -p .run-logs
          set -o pipefail
          node scripts/e2e-user-journey.cjs --smoke \
            2>&1 | tee .run-logs/e2e-smoke-${GITHUB_RUN_ID}.log
          exit ${PIPESTATUS[0]}

      - name: Record staging gate artifact
        shell: bash
        env:
          APP_ENV: staging
          STAGING_SMOKE_TENANT_ID: ${{ secrets.STAGING_SMOKE_TENANT_ID }}
        run: |
          if [ -z "${STAGING_SMOKE_TENANT_ID}" ]; then
            echo "Missing STAGING_SMOKE_TENANT_ID secret for gate artifact."
            exit 1
          fi
          node scripts/record-gate-signoff.cjs \
            --suite STAGING_DEPLOY_POSTCHECK \
            --tenantId "${STAGING_SMOKE_TENANT_ID}" \
            --runUrl "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Capture controlled rollout snapshot
        shell: bash
        env:
          APP_ENV: staging
          STAGING_BASE_URL: ${{ steps.resolve_staging_api_url.outputs.api_url }}
          STAGING_SMOKE_TENANT_ID: ${{ secrets.STAGING_SMOKE_TENANT_ID }}
          STAGING_SMOKE_WORKSPACE: ${{ secrets.STAGING_SMOKE_WORKSPACE }}
          STAGING_SMOKE_USER: ${{ secrets.STAGING_SMOKE_USER }}
          STAGING_SMOKE_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
        run: |
          if [ -z "${STAGING_BASE_URL}" ]; then
            echo "Missing STAGING_BASE_URL secret for rollout snapshot."
            exit 1
          fi
          if [ -z "${STAGING_SMOKE_TENANT_ID}" ]; then
            echo "Missing STAGING_SMOKE_TENANT_ID secret for rollout snapshot."
            exit 1
          fi
          node scripts/capture-controlled-rollout-snapshot.cjs \
            --environment staging \
            --tenantId "${STAGING_SMOKE_TENANT_ID}" \
            --apiBase "${STAGING_BASE_URL}/api/v1" \
            --diagnosticOutputPath ".run-logs/queue-failure-diagnostics-${GITHUB_RUN_ID}.json"

      - name: Capture Shopify vNext rollback snapshot
        if: ${{ inputs.rollback_snapshot }}
        shell: bash
        env:
          STAGING_DATABASE_URL_DIRECT: ${{ secrets.STAGING_DATABASE_URL_DIRECT }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_API_SERVICE: ${{ secrets.RAILWAY_API_SERVICE || 'Vexa API' }}
          RAILWAY_API_SERVICE_ID: ${{ secrets.RAILWAY_API_SERVICE_ID }}
          RAILWAY_WEB_SERVICE: ${{ secrets.RAILWAY_WEB_SERVICE || 'App Vexa' }}
          RAILWAY_WEB_SERVICE_ID: ${{ secrets.RAILWAY_WEB_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_ENVIRONMENT_NAME: Production
          RAILWAY_DEPLOY_RETRIES: "3"
          RAILWAY_DEPLOY_RETRY_DELAY_MS: "10000"
          SNAPSHOT_OUTPUT: .run-logs/shopify-vnext-rollback-snapshot-${{ github.run_id }}.json
        run: |
          if [ -z "${{ inputs.rollback_release_sha }}" ] || [ -z "${{ inputs.rollback_tenant }}" ] || [ -z "${{ inputs.rollback_connector }}" ] || [ -z "${{ inputs.rollback_installation }}" ] || [ -z "${{ inputs.rollback_product }}" ] || [ -z "${{ inputs.rollback_shopify_product_gid }}" ]; then
            echo "Missing one or more rollback snapshot inputs."
            exit 1
          fi
          node scripts/capture-shopify-vnext-rollback-snapshot.cjs \
            --release "${{ inputs.rollback_release_sha }}" \
            --tenant "${{ inputs.rollback_tenant }}" \
            --connector "${{ inputs.rollback_connector }}" \
            --installation "${{ inputs.rollback_installation }}" \
            --product "${{ inputs.rollback_product }}" \
            --shopifyProductGid "${{ inputs.rollback_shopify_product_gid }}" \
            --runUrl "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --output "${SNAPSHOT_OUTPUT}"

      - name: Upload gate + rollout + smoke artifacts
        uses: actions/upload-artifact@v6
        with:
          name: staging-gate-artifacts-${{ github.run_id }}
          path: |
            docs/execution/gates/*.json
            docs/execution/rollout/*CONTROLLED_ROLLOUT_SNAPSHOT.json
            .run-logs/queue-failure-diagnostics-*.json
            .run-logs/internal-ops-summary-acceptance-*.json
            .run-logs/internal-ops-errors-acceptance-*.json
            .run-logs/p0p1-open-issues-*.json
            .run-logs/e2e-smoke-*.log
            .run-logs/e2e-result-*.json
            .run-logs/shopify-vnext-rollback-snapshot-*.json
          include-hidden-files: true
          if-no-files-found: error
