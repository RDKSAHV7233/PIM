name: Deploy Staging

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - docs/execution/gates/**
      - docs/execution/rollout/**

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      APP_ENV: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply migrations
        shell: bash
        env:
          DATABASE_URL_DIRECT: ${{ secrets.STAGING_DATABASE_URL_DIRECT }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL_DIRECT}" ] && [ -z "${DATABASE_URL}" ]; then
            echo "Missing STAGING_DATABASE_URL_DIRECT or STAGING_DATABASE_URL secret for migrations."
            exit 1
          fi
          npm run prisma:migrate:deploy

      - name: Build API
        run: npm run build --workspace @pim1/api

      - name: Build Web
        run: npm run build --workspace @pim1/web

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to staging
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_API_SERVICE: API
          RAILWAY_WEB_SERVICE: PIM1
          RAILWAY_API_SERVICE_ID: ${{ secrets.RAILWAY_API_SERVICE_ID }}
          RAILWAY_WEB_SERVICE_ID: ${{ secrets.RAILWAY_WEB_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_NAME: Staging
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          STAGING_WEB_URL: ${{ secrets.STAGING_WEB_URL }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          node scripts/railway-deploy.cjs

      - name: Staging smoke test
        shell: bash
        env:
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
        run: |
          if [ -z "${STAGING_BASE_URL}" ]; then
            echo "Missing STAGING_BASE_URL secret for smoke tests."
            exit 1
          fi
          response="$(curl -fsS "${STAGING_BASE_URL}/api/v1/health")"
          echo "health=${response}"
          echo "${response}" | grep -q "\"status\":\"ok\""
          echo "${response}" | grep -q "\"env\":\"staging\""

      - name: Staging post-deploy verification (auth + trust boundary)
        shell: bash
        env:
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          STAGING_WEB_URL: ${{ secrets.STAGING_WEB_URL }}
          STAGING_SMOKE_WORKSPACE: ${{ secrets.STAGING_SMOKE_WORKSPACE }}
          STAGING_SMOKE_USER: ${{ secrets.STAGING_SMOKE_USER }}
          STAGING_SMOKE_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
          STAGING_EXPECTED_ENV: staging
          STAGING_VALIDATE_NON_ADMIN: "true"
        run: |
          if [ -z "${STAGING_SMOKE_WORKSPACE}" ]; then
            echo "Missing STAGING_SMOKE_WORKSPACE secret for post-deploy verification."
            exit 1
          fi
          if [ -z "${STAGING_WEB_URL}" ]; then
            echo "Missing STAGING_WEB_URL secret for post-deploy verification."
            exit 1
          fi
          node scripts/staging-postdeploy-check.cjs

      - name: Public signup smoke check
        shell: bash
        env:
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          STAGING_WEB_URL: ${{ secrets.STAGING_WEB_URL }}
          STAGING_EXPECT_PUBLIC_SIGNUP_ENABLED: ${{ secrets.STAGING_EXPECT_PUBLIC_SIGNUP_ENABLED }}
          STAGING_EXPECTED_ENV: staging
        run: |
          if [ -z "${STAGING_BASE_URL}" ]; then
            echo "Missing STAGING_BASE_URL secret for public signup smoke check."
            exit 1
          fi
          node scripts/staging-public-signup-check.cjs

      - name: E2E smoke - post-deploy verification
        shell: bash
        env:
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          STAGING_SMOKE_WORKSPACE: ${{ secrets.STAGING_SMOKE_WORKSPACE }}
          STAGING_SMOKE_USER: ${{ secrets.STAGING_SMOKE_USER }}
          STAGING_SMOKE_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
          STAGING_SMOKE_TENANT_ID: ${{ secrets.STAGING_SMOKE_TENANT_ID }}
          USE_CURL_SHIM: "false"
          E2E_SMOKE: "true"
        run: |
          mkdir -p .run-logs
          set -o pipefail
          node scripts/e2e-user-journey.cjs --smoke \
            2>&1 | tee .run-logs/e2e-smoke-${GITHUB_RUN_ID}.log
          exit ${PIPESTATUS[0]}

      - name: Record staging gate artifact
        shell: bash
        env:
          APP_ENV: staging
          STAGING_SMOKE_TENANT_ID: ${{ secrets.STAGING_SMOKE_TENANT_ID }}
        run: |
          if [ -z "${STAGING_SMOKE_TENANT_ID}" ]; then
            echo "Missing STAGING_SMOKE_TENANT_ID secret for gate artifact."
            exit 1
          fi
          node scripts/record-gate-signoff.cjs \
            --suite STAGING_DEPLOY_POSTCHECK \
            --tenantId "${STAGING_SMOKE_TENANT_ID}" \
            --runUrl "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Capture controlled rollout snapshot
        shell: bash
        env:
          APP_ENV: staging
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          STAGING_SMOKE_TENANT_ID: ${{ secrets.STAGING_SMOKE_TENANT_ID }}
        run: |
          if [ -z "${STAGING_BASE_URL}" ]; then
            echo "Missing STAGING_BASE_URL secret for rollout snapshot."
            exit 1
          fi
          if [ -z "${STAGING_SMOKE_TENANT_ID}" ]; then
            echo "Missing STAGING_SMOKE_TENANT_ID secret for rollout snapshot."
            exit 1
          fi
          node scripts/capture-controlled-rollout-snapshot.cjs \
            --environment staging \
            --tenantId "${STAGING_SMOKE_TENANT_ID}" \
            --apiBase "${STAGING_BASE_URL}/api/v1"

      - name: Upload gate + rollout + smoke artifacts
        uses: actions/upload-artifact@v6
        with:
          name: staging-gate-artifacts-${{ github.run_id }}
          path: |
            docs/execution/gates/*.json
            docs/execution/rollout/*CONTROLLED_ROLLOUT_SNAPSHOT.json
            .run-logs/e2e-smoke-*.log
            .run-logs/e2e-result-*.json
          include-hidden-files: true
          if-no-files-found: error
