name: Deploy Staging

on:
  workflow_dispatch:
    inputs:
      deploy_targets:
        description: "Optional deploy target override: api, web, or api,web"
        required: false
        type: string
  push:
    branches:
      - main
    paths-ignore:
      - docs/execution/gates/**
      - docs/execution/rollout/**

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      APP_ENV: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install system redis-server (for redis-memory-server)
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
          echo "REDISMS_SYSTEM_BINARY=$(command -v redis-server)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply migrations
        shell: bash
        env:
          DATABASE_URL_DIRECT: ${{ secrets.STAGING_DATABASE_URL_DIRECT }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL_DIRECT}" ] && [ -z "${DATABASE_URL}" ]; then
            echo "Missing STAGING_DATABASE_URL_DIRECT or STAGING_DATABASE_URL secret for migrations."
            exit 1
          fi
          npm run prisma:migrate:deploy

      - name: Seed tax regimes
        shell: bash
        env:
          DATABASE_URL_DIRECT: ${{ secrets.STAGING_DATABASE_URL_DIRECT }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          node scripts/seed-tax-regimes.cjs

      - name: Backfill legacy auth hashes
        shell: bash
        env:
          DATABASE_URL_DIRECT: ${{ secrets.STAGING_DATABASE_URL_DIRECT }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          PIM_AUTH_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
          STAGING_SMOKE_TENANT_ID: ${{ secrets.STAGING_SMOKE_TENANT_ID }}
        run: |
          if [ -z "${DATABASE_URL_DIRECT}" ] && [ -z "${DATABASE_URL}" ]; then
            echo "Missing STAGING_DATABASE_URL_DIRECT or STAGING_DATABASE_URL secret for auth hash backfill."
            exit 1
          fi
          if [ -z "${PIM_AUTH_PASSWORD}" ]; then
            echo "Missing STAGING_SMOKE_PASSWORD secret for auth hash backfill."
            exit 1
          fi
          if [ -z "${STAGING_SMOKE_TENANT_ID}" ]; then
            echo "Missing STAGING_SMOKE_TENANT_ID secret — cannot scope auth hash backfill to staging tenant."
            exit 1
          fi
          node scripts/migrate-legacy-auth-password-hashes.cjs --tenant "${STAGING_SMOKE_TENANT_ID}"

      - name: Sync smoke-test identity password
        shell: bash
        env:
          DATABASE_URL_DIRECT: ${{ secrets.STAGING_DATABASE_URL_DIRECT }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          RESET_IDENTITY_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
          STAGING_SMOKE_TENANT_ID: ${{ secrets.STAGING_SMOKE_TENANT_ID }}
          STAGING_SMOKE_USER: ${{ secrets.STAGING_SMOKE_USER }}
        run: |
          # migrate-legacy-auth-password-hashes.cjs above only fills identities with
          # passwordHash: null — it never re-syncs an already-provisioned identity's
          # hash when STAGING_SMOKE_PASSWORD is rotated. Without this step, rotating
          # that secret silently breaks every login-dependent check below without
          # ever touching the actual credential the smoke test submits.
          if [ -z "${STAGING_SMOKE_USER}" ]; then
            echo "Missing STAGING_SMOKE_USER secret — cannot target smoke identity password sync."
            exit 1
          fi
          node scripts/reset-smoke-identity-password.cjs --tenant "${STAGING_SMOKE_TENANT_ID}" --user "${STAGING_SMOKE_USER}"

      - name: Build API
        run: npm run build --workspace @pim1/api

      - name: Build Web
        run: npm run build --workspace @pim1/web

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Resolve staging API URL
        id: resolve_staging_api_url
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_API_SERVICE || 'Vexa API' }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_API_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_ENVIRONMENT_NAME: Staging
          FALLBACK_STAGING_API_URL: ${{ secrets.STAGING_BASE_URL }}
        run: |
          resolved_api_url="$(node scripts/resolve-railway-service-url.cjs 2>/dev/null || true)"
          if [ -z "${resolved_api_url}" ]; then
            resolved_api_url="${FALLBACK_STAGING_API_URL}"
          fi
          if [ -z "${resolved_api_url}" ]; then
            echo "Could not resolve staging API URL from Railway and no STAGING_BASE_URL secret fallback is configured."
            exit 1
          fi
          echo "api_url=${resolved_api_url}" >> "$GITHUB_OUTPUT"

      - name: Deploy to staging
        timeout-minutes: 45
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_API_SERVICE: ${{ secrets.RAILWAY_API_SERVICE || 'Vexa API' }}
          RAILWAY_WEB_SERVICE: ${{ secrets.RAILWAY_WEB_SERVICE || 'App Vexa' }}
          RAILWAY_API_SERVICE_ID: ${{ secrets.RAILWAY_API_SERVICE_ID }}
          RAILWAY_WEB_SERVICE_ID: ${{ secrets.RAILWAY_WEB_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_ENVIRONMENT_NAME: Staging
          RAILWAY_DEPLOY_TARGETS: ${{ inputs.deploy_targets }}
          DATABASE_URL_POOLED: ${{ secrets.STAGING_DATABASE_URL }}
          DATABASE_URL_DIRECT: ${{ secrets.STAGING_DATABASE_URL_DIRECT }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_BASE_URL: ${{ steps.resolve_staging_api_url.outputs.api_url }}
          STAGING_WEB_URL: ${{ secrets.STAGING_WEB_URL }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
          ERROR_AUTHORITY_RELEASE: ${{ github.sha }}
          ERROR_AUTHORITY_INGEST_TOKEN: ${{ secrets.ERROR_AUTHORITY_INGEST_TOKEN }}
          RAILWAY_DEPLOY_RETRIES: "1"
          RAILWAY_DEPLOY_TIMEOUT_MS: "2400000"
          RAILWAY_DEPLOY_RETRY_DELAY_MS: "10000"
        run: |
          node scripts/railway-deploy.cjs

      - name: Resolve staging web URL
        id: resolve_staging_web_url
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_WEB_SERVICE: ${{ secrets.RAILWAY_WEB_SERVICE || 'App Vexa' }}
          RAILWAY_WEB_SERVICE_ID: ${{ secrets.RAILWAY_WEB_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_ENVIRONMENT_NAME: Staging
          FALLBACK_STAGING_WEB_URL: ${{ secrets.STAGING_WEB_URL }}
        run: |
          resolved_web_url="$(node scripts/resolve-railway-service-url.cjs 2>/dev/null || true)"
          if [ -z "${resolved_web_url}" ]; then
            resolved_web_url="${FALLBACK_STAGING_WEB_URL}"
          fi
          if [ -z "${resolved_web_url}" ]; then
            echo "Could not resolve staging web URL from Railway and no STAGING_WEB_URL secret fallback is configured."
            exit 1
          fi
          echo "web_url=${resolved_web_url}" >> "$GITHUB_OUTPUT"

      - name: Staging smoke test
        shell: bash
        env:
          STAGING_BASE_URL: ${{ steps.resolve_staging_api_url.outputs.api_url }}
        run: |
          if [ -z "${STAGING_BASE_URL}" ]; then
            echo "Missing STAGING_BASE_URL secret for smoke tests."
            exit 1
          fi
          response=""
          for attempt in $(seq 1 30); do
            if response="$(curl -fsS --max-time 20 "${STAGING_BASE_URL}/api/v1/health")"; then
              echo "health=${response}"
              echo "${response}" | grep -q "\"status\":\"ok\""
              echo "${response}" | grep -q "\"env\":\"staging\""
              exit 0
            fi
            echo "::warning::Staging health probe attempt ${attempt}/30 failed; waiting for Railway readiness."
            sleep 10
          done
          echo "Staging health did not become ready after 30 attempts."
          exit 1

      - name: Cleanup failed BullMQ jobs
        continue-on-error: true
        shell: bash
        env:
          STAGING_BASE_URL: ${{ steps.resolve_staging_api_url.outputs.api_url }}
          STAGING_SMOKE_WORKSPACE: ${{ secrets.STAGING_SMOKE_WORKSPACE }}
          STAGING_SMOKE_USER: ${{ secrets.STAGING_SMOKE_USER }}
          STAGING_SMOKE_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
        run: |
          if [ -z "${STAGING_BASE_URL}" ] || [ -z "${STAGING_SMOKE_USER}" ]; then
            echo "Skipping BullMQ cleanup — missing staging secrets."
            exit 0
          fi
          login_response="$(curl -sS "${STAGING_BASE_URL}/api/v1/auth/login" \
            -H 'Content-Type: application/json' \
            -d "{\"workspaceSlug\":\"${STAGING_SMOKE_WORKSPACE}\",\"userId\":\"${STAGING_SMOKE_USER}\",\"password\":\"${STAGING_SMOKE_PASSWORD}\"}")" || true
          token="$(echo "${login_response}" | jq -r '.token // .accessToken // empty')"
          if [ -z "${token}" ]; then
            echo "::warning::Could not obtain admin token for BullMQ cleanup."
            exit 0
          fi
          cleanup="$(curl -fsS "${STAGING_BASE_URL}/api/v1/queue/cleanup-failed" \
            -X POST -H "Authorization: Bearer ${token}" -H 'Content-Type: application/json')"
          echo "cleanup=${cleanup}"

      - name: Staging post-deploy verification (auth + trust boundary)
        shell: bash
        env:
          STAGING_BASE_URL: ${{ steps.resolve_staging_api_url.outputs.api_url }}
          STAGING_WEB_URL: ${{ steps.resolve_staging_web_url.outputs.web_url }}
          STAGING_SMOKE_WORKSPACE: ${{ secrets.STAGING_SMOKE_WORKSPACE }}
          STAGING_SMOKE_USER: ${{ secrets.STAGING_SMOKE_USER }}
          STAGING_SMOKE_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
          STAGING_EXPECTED_ENV: staging
          STAGING_VALIDATE_NON_ADMIN: "true"
        run: |
          if [ -z "${STAGING_SMOKE_WORKSPACE}" ]; then
            echo "Missing STAGING_SMOKE_WORKSPACE secret for post-deploy verification."
            exit 1
          fi
          if [ -z "${STAGING_WEB_URL}" ]; then
            echo "Missing STAGING_WEB_URL secret for post-deploy verification."
            exit 1
          fi
          node scripts/staging-postdeploy-check.cjs

      - name: Public signup smoke check
        id: signup_check
        continue-on-error: true
        shell: bash
        env:
          STAGING_BASE_URL: ${{ steps.resolve_staging_api_url.outputs.api_url }}
          STAGING_WEB_URL: ${{ steps.resolve_staging_web_url.outputs.web_url }}
          STAGING_EXPECT_PUBLIC_SIGNUP_ENABLED: ${{ secrets.STAGING_EXPECT_PUBLIC_SIGNUP_ENABLED }}
          STAGING_EXPECTED_ENV: staging
        run: |
          if [ -z "${STAGING_BASE_URL}" ]; then
            echo "Missing STAGING_BASE_URL secret for public signup smoke check."
            exit 1
          fi
          node scripts/staging-public-signup-check.cjs

      - name: Warn on signup check mismatch
        if: steps.signup_check.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::Public signup smoke check failed — STAGING_EXPECT_PUBLIC_SIGNUP_ENABLED may not match the live staging state. Fix: set the secret to match the actual signup availability (ops runbook item #8)."

      - name: E2E smoke - post-deploy verification
        shell: bash
        env:
          STAGING_BASE_URL: ${{ steps.resolve_staging_api_url.outputs.api_url }}
          STAGING_SMOKE_WORKSPACE: ${{ secrets.STAGING_SMOKE_WORKSPACE }}
          STAGING_SMOKE_USER: ${{ secrets.STAGING_SMOKE_USER }}
          STAGING_SMOKE_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
          STAGING_SMOKE_TENANT_ID: ${{ secrets.STAGING_SMOKE_TENANT_ID }}
          USE_CURL_SHIM: "false"
          E2E_SMOKE: "true"
        run: |
          mkdir -p .run-logs
          set -o pipefail
          node scripts/e2e-user-journey.cjs --smoke \
            2>&1 | tee .run-logs/e2e-smoke-${GITHUB_RUN_ID}.log
          exit ${PIPESTATUS[0]}

      - name: Record staging gate artifact
        shell: bash
        env:
          APP_ENV: staging
          STAGING_SMOKE_TENANT_ID: ${{ secrets.STAGING_SMOKE_TENANT_ID }}
        run: |
          if [ -z "${STAGING_SMOKE_TENANT_ID}" ]; then
            echo "Missing STAGING_SMOKE_TENANT_ID secret for gate artifact."
            exit 1
          fi
          node scripts/record-gate-signoff.cjs \
            --suite STAGING_DEPLOY_POSTCHECK \
            --tenantId "${STAGING_SMOKE_TENANT_ID}" \
            --runUrl "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Capture controlled rollout snapshot
        shell: bash
        env:
          APP_ENV: staging
          STAGING_BASE_URL: ${{ steps.resolve_staging_api_url.outputs.api_url }}
          STAGING_SMOKE_TENANT_ID: ${{ secrets.STAGING_SMOKE_TENANT_ID }}
          STAGING_SMOKE_WORKSPACE: ${{ secrets.STAGING_SMOKE_WORKSPACE }}
          STAGING_SMOKE_USER: ${{ secrets.STAGING_SMOKE_USER }}
          STAGING_SMOKE_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
        run: |
          if [ -z "${STAGING_BASE_URL}" ]; then
            echo "Missing STAGING_BASE_URL secret for rollout snapshot."
            exit 1
          fi
          if [ -z "${STAGING_SMOKE_TENANT_ID}" ]; then
            echo "Missing STAGING_SMOKE_TENANT_ID secret for rollout snapshot."
            exit 1
          fi
          node scripts/capture-controlled-rollout-snapshot.cjs \
            --environment staging \
            --tenantId "${STAGING_SMOKE_TENANT_ID}" \
            --apiBase "${STAGING_BASE_URL}/api/v1" \
            --diagnosticOutputPath ".run-logs/queue-failure-diagnostics-${GITHUB_RUN_ID}.json"

      - name: Upload gate + rollout + smoke artifacts
        uses: actions/upload-artifact@v6
        with:
          name: staging-gate-artifacts-${{ github.run_id }}
          path: |
            docs/execution/gates/*.json
            docs/execution/rollout/*CONTROLLED_ROLLOUT_SNAPSHOT.json
            .run-logs/queue-failure-diagnostics-*.json
            .run-logs/e2e-smoke-*.log
            .run-logs/e2e-result-*.json
          include-hidden-files: true
          if-no-files-found: error
