name: "[DR DRILL #919] One-off restore verification (temporary, not for merge)"

# One-off workflow for the #919 controlled restore drill. Restores an
# EXISTING, already-successful production R2 backup into an isolated,
# non-production, throwaway Postgres instance and runs read-only
# aggregate verification. Never touches production. Never restores over
# production. Never modifies or deletes the source R2 backup object.
#
# This file exists only on the issue-919/backup-dr-evidence branch and
# is removed after the drill. It must never be merged to main.

on:
  workflow_dispatch:

jobs:
  dr-drill-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    permissions:
      contents: read
    steps:
      - name: Install PostgreSQL 18 client (psql, matching the production server major version)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          # aws CLI v2 is already preinstalled on GitHub-hosted ubuntu-latest runners.
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Download the frozen backup object from R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PRIVATE_BUCKET_NAME: ${{ secrets.R2_PRIVATE_BUCKET_NAME }}
        run: |
          set -euo pipefail
          # Gate 1 frozen backup key — do not change without updating #919's evidence.
          BACKUP_KEY="backups/2026-09-21T07-20-54-154Z.sql.gz"
          AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" \
          AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" \
          AWS_DEFAULT_REGION="auto" \
          aws s3 cp "s3://${R2_PRIVATE_BUCKET_NAME}/${BACKUP_KEY}" /tmp/drill-backup.sql.gz \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --no-progress
          gunzip -k /tmp/drill-backup.sql.gz
          echo "Downloaded and decompressed size: $(stat -c%s /tmp/drill-backup.sql) bytes"
          echo "Gzip size: $(stat -c%s /tmp/drill-backup.sql.gz) bytes (expect 10428845)"

      - name: "GATE 3 — restore into the isolated temporary target"
        env:
          DR_DRILL_TARGET_DATABASE_URL: ${{ secrets.DR_DRILL_TARGET_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DR_DRILL_TARGET_DATABASE_URL}" ]; then
            echo "Missing DR_DRILL_TARGET_DATABASE_URL — cannot run drill." >&2
            exit 1
          fi
          echo "RESTORE_START: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Plain-SQL restore, matching the actual backup format produced by
          # r2-backup-run.cjs (pg_dump --format=plain). db-restore.sh's
          # pg_restore path does not apply to this backup format and was
          # deliberately not used here for that reason.
          psql "$DR_DRILL_TARGET_DATABASE_URL" -v ON_ERROR_STOP=1 -f /tmp/drill-backup.sql > /tmp/restore.log 2>&1 || RESTORE_EXIT=$?
          echo "RESTORE_END: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "RESTORE_EXIT_STATUS: ${RESTORE_EXIT:-0}"
          echo "--- restore log tail (last 40 lines) ---"
          tail -40 /tmp/restore.log
          if [ "${RESTORE_EXIT:-0}" != "0" ]; then
            echo "RESTORE FAILED"
            exit 1
          fi

      - name: "GATE 4 — read-only integrity verification (aggregate counts only)"
        env:
          DR_DRILL_TARGET_DATABASE_URL: ${{ secrets.DR_DRILL_TARGET_DATABASE_URL }}
        run: |
          set -euo pipefail
          echo "=== Database responds ==="
          psql "$DR_DRILL_TARGET_DATABASE_URL" -t -c "SELECT version();"

          echo "=== Prisma migrations table state (last 5) ==="
          psql "$DR_DRILL_TARGET_DATABASE_URL" -c "SELECT migration_name, finished_at FROM \"_prisma_migrations\" ORDER BY finished_at DESC LIMIT 5;" || echo "NOT VERIFIED — table not found"

          echo "=== Aggregate counts (verified against schema.prisma model/@@map names) ==="
          for T in "WorkspaceDirectory" "AuthIdentity" "Product" "Variant" "Category" "AttributeDefinition" "BulkImportJob" "MarketplaceExportJob" "connector_installations"; do
            echo -n "$T: "
            psql "$DR_DRILL_TARGET_DATABASE_URL" -t -c "SELECT COUNT(*) FROM \"$T\";" 2>&1 | tr -d ' ' || echo "NOT VERIFIED"
          done

      - name: Cleanup local files (temp DB teardown happens outside CI, from Railway)
        if: always()
        run: rm -f /tmp/drill-backup.sql /tmp/drill-backup.sql.gz /tmp/restore.log
