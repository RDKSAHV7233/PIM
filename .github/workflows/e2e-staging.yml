name: E2E - Staging User Journey

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      section:
        description: "Run only this section (for example: auth, catalog, users). Leave blank for the full suite."
        required: false
        default: ""
      smoke:
        description: "Run in smoke mode (fast subset, about 30 checks)"
        required: false
        default: "false"
      fail_on_skip:
        description: "Fail the job if any check is skipped"
        required: false
        default: "false"

concurrency:
  group: e2e-staging
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  e2e:
    name: E2E User Journey - Staging
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Resolve staging API URL
        id: resolve_staging_api_url
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_API_SERVICE || 'Vexa API' }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_API_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_ENVIRONMENT_NAME: Staging
          FALLBACK_STAGING_API_URL: ${{ secrets.STAGING_BASE_URL }}
        run: |
          resolved_api_url="$(node scripts/resolve-railway-service-url.cjs 2>/dev/null || true)"
          if [ -z "${resolved_api_url}" ]; then
            resolved_api_url="${FALLBACK_STAGING_API_URL}"
          fi
          if [ -z "${resolved_api_url}" ]; then
            echo "Could not resolve staging API URL from Railway and no STAGING_BASE_URL secret fallback is configured."
            exit 1
          fi
          echo "api_url=${resolved_api_url}" >> "$GITHUB_OUTPUT"

      - name: Resolve staging web URL
        id: resolve_staging_web_url
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_WEB_SERVICE: ${{ secrets.RAILWAY_WEB_SERVICE || 'App Vexa' }}
          RAILWAY_WEB_SERVICE_ID: ${{ secrets.RAILWAY_WEB_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_ENVIRONMENT_NAME: Staging
          FALLBACK_STAGING_WEB_URL: ${{ secrets.STAGING_WEB_URL }}
        run: |
          resolved_web_url="$(node scripts/resolve-railway-service-url.cjs 2>/dev/null || true)"
          if [ -z "${resolved_web_url}" ]; then
            resolved_web_url="${FALLBACK_STAGING_WEB_URL}"
          fi
          if [ -z "${resolved_web_url}" ]; then
            echo "Could not resolve staging web URL from Railway and no STAGING_WEB_URL secret fallback is configured."
            exit 1
          fi
          echo "web_url=${resolved_web_url}" >> "$GITHUB_OUTPUT"

      - name: Public signup smoke check
        id: signup_check
        continue-on-error: true
        env:
          STAGING_BASE_URL: ${{ steps.resolve_staging_api_url.outputs.api_url }}
          STAGING_WEB_URL: ${{ steps.resolve_staging_web_url.outputs.web_url }}
          STAGING_EXPECT_PUBLIC_SIGNUP_ENABLED: ${{ secrets.STAGING_EXPECT_PUBLIC_SIGNUP_ENABLED }}
          STAGING_EXPECTED_ENV: staging
        run: |
          node scripts/staging-public-signup-check.cjs

      - name: Warn on signup check mismatch
        if: steps.signup_check.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::Public signup smoke check failed — STAGING_EXPECT_PUBLIC_SIGNUP_ENABLED may not match the live staging state."

      - name: Run E2E suite
        id: e2e
        env:
          STAGING_BASE_URL: ${{ steps.resolve_staging_api_url.outputs.api_url }}
          STAGING_WEB_URL: ${{ steps.resolve_staging_web_url.outputs.web_url }}
          STAGING_SMOKE_WORKSPACE: ${{ secrets.STAGING_SMOKE_WORKSPACE }}
          STAGING_SMOKE_USER: ${{ secrets.STAGING_SMOKE_USER }}
          STAGING_SMOKE_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
          STAGING_SMOKE_TENANT_ID: ${{ secrets.STAGING_SMOKE_TENANT_ID }}
          STAGING_AMAZON_SELLER_ID: ${{ secrets.STAGING_AMAZON_SELLER_ID }}
          STAGING_AMAZON_CLIENT_ID: ${{ secrets.STAGING_AMAZON_CLIENT_ID }}
          STAGING_AMAZON_CLIENT_SECRET: ${{ secrets.STAGING_AMAZON_CLIENT_SECRET }}
          STAGING_AMAZON_REFRESH_TOKEN: ${{ secrets.STAGING_AMAZON_REFRESH_TOKEN }}
          USE_CURL_SHIM: "false"
          E2E_SECTION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.section || '' }}
          E2E_SMOKE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.smoke || 'false' }}
          E2E_FAIL_ON_SKIP: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.fail_on_skip || 'false' }}
        run: |
          mkdir -p .run-logs
          set -o pipefail
          ARGS=()
          if [ "$E2E_SMOKE" = "true" ]; then
            ARGS+=(--smoke)
          fi
          if [ -n "$E2E_SECTION" ]; then
            ARGS+=(--section "$E2E_SECTION")
          fi
          if [ "$E2E_FAIL_ON_SKIP" = "true" ]; then
            ARGS+=(--fail-on-skip)
          fi
          node scripts/e2e-user-journey.cjs "${ARGS[@]}" 2>&1 | tee .run-logs/e2e-ci-${GITHUB_RUN_ID}.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Parse summary line
        if: always()
        id: summary
        run: |
          SUMMARY=$(grep -E '^  TOTAL' .run-logs/e2e-ci-${GITHUB_RUN_ID}.log | tail -1 || echo 'TOTAL unknown')
          echo "summary=$SUMMARY" >> "$GITHUB_OUTPUT"
          echo "$SUMMARY"

      - name: Write job summary
        if: always()
        run: |
          echo "## E2E Staging Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Summary: ${{ steps.summary.outputs.summary }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat .run-logs/e2e-ci-${GITHUB_RUN_ID}.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-log-${{ github.sha }}-${{ github.run_id }}
          path: .run-logs/**
          include-hidden-files: true
          retention-days: 30

      - name: Fail if suite exit code non-zero
        if: steps.e2e.outputs.exit_code != '0'
        run: |
          echo "E2E suite reported failures. See log artifact."
          exit 1
