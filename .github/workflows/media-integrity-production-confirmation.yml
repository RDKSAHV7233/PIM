name: Media Integrity Production Confirmation

on:
  workflow_dispatch:

jobs:
  media-integrity-production-confirmation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: media-integrity-production-confirmation
      cancel-in-progress: false
    env:
      APP_ENV: production
      MEDIA_INTEGRITY_TARGET_ENV: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install system redis-server (for redis-memory-server)
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
          echo "REDISMS_SYSTEM_BINARY=$(command -v redis-server)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Run read-only media integrity report
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.STAGE3_DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || secrets.STAGE3_R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || secrets.STAGE3_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.STAGE3_R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || secrets.STAGE3_R2_BUCKET_NAME }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT || secrets.STAGE3_R2_ENDPOINT }}
          STORAGE_BACKEND: ${{ vars.STORAGE_BACKEND }}
          MEDIA_STORAGE_MODE: ${{ vars.MEDIA_STORAGE_MODE }}
          MEDIA_INTEGRITY_VERIFY_LOCAL_FILES: "false"
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "Missing STAGE3_DATABASE_URL secret for production media integrity confirmation."
            exit 1
          fi
          node scripts/media-integrity-readonly-report.cjs \
            --target-environment production \
            --output .run-logs/media-integrity-production-confirmation.json

      - name: Upload report artifact
        uses: actions/upload-artifact@v6
        with:
          name: media-integrity-production-confirmation-${{ github.run_id }}
          path: .run-logs/media-integrity-production-confirmation.json
          if-no-files-found: error
