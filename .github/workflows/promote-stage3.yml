name: Promote Stage 3

on:
  workflow_dispatch:
    inputs:
      staging_url:
        description: "Stage 3 API base URL (e.g. https://api.<your-domain>.com)"
        required: true
        type: string
      deploy_targets:
        description: "Optional deploy target override: api, web, or api,web"
        required: false
        type: string

jobs:
  promote-stage3:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: production
    concurrency:
      group: promote-stage3
      cancel-in-progress: false
    env:
      NODE_VERSION: "20"
      APP_ENV: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Validate production deploy contract
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_API_SERVICE: ${{ secrets.RAILWAY_API_SERVICE || 'Vexa API' }}
          RAILWAY_WEB_SERVICE: ${{ secrets.RAILWAY_WEB_SERVICE || 'App Vexa' }}
          RAILWAY_API_SERVICE_ID: ${{ secrets.RAILWAY_API_SERVICE_ID }}
          RAILWAY_WEB_SERVICE_ID: ${{ secrets.RAILWAY_WEB_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_NAME: Production
          STAGING_BASE_URL: ${{ inputs.staging_url }}
          STAGING_WEB_URL: ${{ secrets.STAGE3_WEB_URL }}
        run: |
          node scripts/validate-staging-deploy-config.cjs

      - name: Apply migrations
        shell: bash
        env:
          DATABASE_URL_DIRECT: ${{ secrets.STAGE3_DATABASE_URL_DIRECT }}
          DATABASE_URL: ${{ secrets.STAGE3_DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL_DIRECT}" ] && [ -z "${DATABASE_URL}" ]; then
            echo "Missing STAGE3_DATABASE_URL_DIRECT or STAGE3_DATABASE_URL secret."
            exit 1
          fi
          npm run prisma:migrate:deploy

      - name: Build API
        run: npm run build --workspace @pim1/api

      - name: Build Web
        run: npm run build --workspace @pim1/web

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to production
        timeout-minutes: 45
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_API_SERVICE: ${{ secrets.RAILWAY_API_SERVICE || 'Vexa API' }}
          RAILWAY_WEB_SERVICE: ${{ secrets.RAILWAY_WEB_SERVICE || 'App Vexa' }}
          RAILWAY_API_SERVICE_ID: ${{ secrets.RAILWAY_API_SERVICE_ID }}
          RAILWAY_WEB_SERVICE_ID: ${{ secrets.RAILWAY_WEB_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_NAME: Production
          RAILWAY_DEPLOY_TARGETS: ${{ inputs.deploy_targets }}
          STAGING_BASE_URL: ${{ inputs.staging_url }}
          STAGING_WEB_URL: ${{ secrets.STAGE3_WEB_URL }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          RAILWAY_DEPLOY_RETRIES: "2"
          RAILWAY_DEPLOY_TIMEOUT_MS: "600000"
          RAILWAY_DEPLOY_RETRY_DELAY_MS: "5000"
        run: |
          node scripts/railway-deploy.cjs

      - name: Resolve production web URL
        id: resolve_production_web_url
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_WEB_SERVICE: ${{ secrets.RAILWAY_WEB_SERVICE || 'App Vexa' }}
          RAILWAY_WEB_SERVICE_ID: ${{ secrets.RAILWAY_WEB_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_NAME: Production
          FALLBACK_STAGING_WEB_URL: ${{ secrets.STAGE3_WEB_URL }}
        run: |
          resolved_web_url="$(node scripts/resolve-railway-service-url.cjs 2>/dev/null || true)"
          if [ -z "${resolved_web_url}" ]; then
            resolved_web_url="${FALLBACK_STAGING_WEB_URL}"
          fi
          if [ -z "${resolved_web_url}" ]; then
            echo "Could not resolve production web URL from Railway and no STAGE3_WEB_URL secret fallback is configured."
            exit 1
          fi
          echo "web_url=${resolved_web_url}" >> "$GITHUB_OUTPUT"

      - name: Health probe
        shell: bash
        env:
          STAGING_URL: ${{ inputs.staging_url }}
        run: |
          response="$(curl -fsS "${STAGING_URL}/api/v1/health")"
          echo "health=${response}"
          echo "${response}" | grep -q "\"status\":\"ok\""

      - name: Post-deploy auth + trust boundary check
        shell: bash
        env:
          STAGING_BASE_URL: ${{ inputs.staging_url }}
          STAGING_WEB_URL: ${{ steps.resolve_production_web_url.outputs.web_url }}
          STAGING_SMOKE_WORKSPACE: ${{ secrets.STAGE3_SMOKE_WORKSPACE }}
          STAGING_SMOKE_USER: ${{ secrets.STAGE3_SMOKE_USER }}
          STAGING_SMOKE_PASSWORD: ${{ secrets.STAGE3_SMOKE_PASSWORD }}
          STAGING_EXPECTED_ENV: production
          STAGING_VALIDATE_NON_ADMIN: "true"
        run: |
          if [ -z "${STAGING_SMOKE_WORKSPACE}" ]; then
            echo "Missing STAGE3_SMOKE_WORKSPACE secret."
            exit 1
          fi
          node scripts/staging-postdeploy-check.cjs

      - name: Public signup smoke check
        shell: bash
        env:
          STAGING_BASE_URL: ${{ inputs.staging_url }}
          STAGING_WEB_URL: ${{ steps.resolve_production_web_url.outputs.web_url }}
          STAGING_EXPECT_PUBLIC_SIGNUP_ENABLED: "true"
          STAGING_EXPECTED_ENV: production
        run: |
          node scripts/staging-public-signup-check.cjs

      - name: Tenant RLS isolation check
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.STAGE3_DATABASE_URL }}
          DATABASE_URL_DIRECT: ${{ secrets.STAGE3_DATABASE_URL_DIRECT }}
        run: |
          node scripts/verify-tenant-rls.cjs

      - name: Stage 3 readiness summary
        shell: bash
        run: |
          echo "Stage 3 gate passed."
          echo "Verify daily backup and complete pilot go-live checklist (docs/hosting/stage-3-pilot-ready.md)."
