name: "[ONE-OFF] Read-only R2 bucket config check (temporary, not for merge)"

# One-off, strictly READ-ONLY inspection of the R2 backup/export bucket's
# configuration: encryption, public access, versioning, lifecycle rules,
# and a listing of the backups/ prefix to see actual retention in
# practice. No object is written, modified, or deleted. No bucket
# setting is changed. Reuses existing R2_* secrets without ever
# printing them. Removed from main immediately after use.

on:
  workflow_dispatch:

jobs:
  r2-config-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    permissions:
      contents: read
    steps:
      - name: Bucket-level configuration (read-only)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PRIVATE_BUCKET_NAME: ${{ secrets.R2_PRIVATE_BUCKET_NAME }}
        run: |
          set -uo pipefail  # no -e: individual checks may legitimately fail/not-apply on R2
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export AWS_DEFAULT_REGION="auto"
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

          echo "=== Bucket encryption ==="
          aws s3api get-bucket-encryption --bucket "$R2_PRIVATE_BUCKET_NAME" --endpoint-url "$ENDPOINT" 2>&1 || echo "(not returned — R2 encrypts at rest by default regardless; this call may be unsupported on R2's S3-compatible API)"

          echo ""
          echo "=== Public access block ==="
          aws s3api get-public-access-block --bucket "$R2_PRIVATE_BUCKET_NAME" --endpoint-url "$ENDPOINT" 2>&1 || echo "(not returned — this call may be unsupported on R2's S3-compatible API; public-access is a Cloudflare-dashboard-level R2 setting, not always exposed via this API)"

          echo ""
          echo "=== Bucket ACL ==="
          aws s3api get-bucket-acl --bucket "$R2_PRIVATE_BUCKET_NAME" --endpoint-url "$ENDPOINT" 2>&1 || echo "(not returned — unsupported or default-private)"

          echo ""
          echo "=== Bucket policy ==="
          aws s3api get-bucket-policy --bucket "$R2_PRIVATE_BUCKET_NAME" --endpoint-url "$ENDPOINT" 2>&1 || echo "(no bucket policy set, or unsupported)"

          echo ""
          echo "=== Versioning ==="
          aws s3api get-bucket-versioning --bucket "$R2_PRIVATE_BUCKET_NAME" --endpoint-url "$ENDPOINT" 2>&1 || echo "(not returned)"

          echo ""
          echo "=== Lifecycle configuration ==="
          aws s3api get-bucket-lifecycle-configuration --bucket "$R2_PRIVATE_BUCKET_NAME" --endpoint-url "$ENDPOINT" 2>&1 || echo "(no lifecycle rules configured, or unsupported)"

          echo ""
          echo "=== CORS configuration ==="
          aws s3api get-bucket-cors --bucket "$R2_PRIVATE_BUCKET_NAME" --endpoint-url "$ENDPOINT" 2>&1 || echo "(no CORS rules configured)"

      - name: backups/ prefix listing (metadata only — names, sizes, dates; no content downloaded)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PRIVATE_BUCKET_NAME: ${{ secrets.R2_PRIVATE_BUCKET_NAME }}
        run: |
          set -uo pipefail
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export AWS_DEFAULT_REGION="auto"
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

          echo "=== backups/ prefix: full listing (oldest to newest) ==="
          aws s3 ls "s3://${R2_PRIVATE_BUCKET_NAME}/backups/" --endpoint-url "$ENDPOINT" --recursive | sort

          echo ""
          echo "=== backups/ object count ==="
          aws s3 ls "s3://${R2_PRIVATE_BUCKET_NAME}/backups/" --endpoint-url "$ENDPOINT" --recursive | wc -l

          echo ""
          echo "=== exports/ prefix: top-level tenant folder count only (no filenames/content) ==="
          aws s3 ls "s3://${R2_PRIVATE_BUCKET_NAME}/exports/" --endpoint-url "$ENDPOINT" | wc -l

          echo ""
          echo "=== bucket total object count and size (all prefixes, metadata only) ==="
          aws s3 ls "s3://${R2_PRIVATE_BUCKET_NAME}/" --endpoint-url "$ENDPOINT" --recursive --summarize | tail -5
