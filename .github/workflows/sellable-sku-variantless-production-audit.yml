name: Sellable SKU Variant-less Production Audit

on:
  workflow_dispatch:

jobs:
  sellable-sku-variantless-production-audit:
    runs-on: ubuntu-latest
    # First run has no npm cache to restore (cache key is seeded from a
    # successful job); a cold `npm ci` for this monorepo took >10m and was
    # killed before ever reaching the actual query. 25m covers a cold
    # install + prisma generate with headroom; warm-cache runs finish in
    # well under a third of that.
    timeout-minutes: 25
    environment: production
    concurrency:
      group: sellable-sku-variantless-production-audit
      cancel-in-progress: false
    env:
      APP_ENV: production
      SELLABLE_SKU_AUDIT_TARGET_ENV: production
      # redis-memory-server (a root devDependency, unused by this workflow)
      # otherwise tries to download/compile a Redis Stack binary during npm
      # ci's postinstall, which failed with a native build error on this
      # workflow's first cold run. This is its own documented skip flag,
      # already used the same way by every ci.yml job that doesn't need a
      # real Redis — no system redis-server needed.
      REDISMS_DISABLE_POSTINSTALL: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Run read-only sellable-SKU variant-less audit report
        shell: bash
        env:
          # SEC-DB-RLS-001 7.9c, opt-in: while PRODUCTION_REPORTER_DATABASE_URL is unset REPORTER_DATABASE_URL is empty and the script keeps using DATABASE_URL, exactly as before.
          # When a person stores the vexa_reporter credential there, the script uses it and first checks that the connection really is that role.
          # The DATABASE_URL line below is the existing fallback; the cutover removes it (docs/qa/sec-db-rls-001-7-9c-operator-wiring-2026-10-07.md).
          DATABASE_URL: ${{ secrets.STAGE3_DATABASE_URL }}
          REPORTER_DATABASE_URL: ${{ secrets.PRODUCTION_REPORTER_DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL}" ] && [ -z "${REPORTER_DATABASE_URL}" ]; then
            echo "Missing STAGE3_DATABASE_URL secret for production sellable-SKU audit (and PRODUCTION_REPORTER_DATABASE_URL is not set)."
            exit 1
          fi
          node scripts/sellable-sku-variantless-audit-report.cjs \
            --target-environment production \
            --output .run-logs/sellable-sku-variantless-production-audit.json

      - name: Upload report artifact
        uses: actions/upload-artifact@v6
        with:
          name: sellable-sku-variantless-production-audit-${{ github.run_id }}
          path: .run-logs/sellable-sku-variantless-production-audit.json
          if-no-files-found: error
