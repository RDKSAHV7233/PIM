name: Shopify vNext Rollback Snapshot

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Exact deployed release SHA being authorized"
        required: true
        type: string
      tenant:
        description: "Tenant key"
        required: true
        type: string
      connector:
        description: "Connector slug"
        required: true
        type: string
      installation:
        description: "Connector installation ID"
        required: true
        type: string
      product:
        description: "PIM product ID"
        required: true
        type: string
      shopify_product_gid:
        description: "Shopify Product GID"
        required: true
        type: string

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      APP_ENV: staging
      REDISMS_DISABLE_POSTINSTALL: "true"
      STAGING_DATABASE_URL_DIRECT: ${{ secrets.STAGING_DATABASE_URL_DIRECT }}
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
      RAILWAY_API_SERVICE: ${{ secrets.RAILWAY_API_SERVICE || 'Vexa API' }}
      RAILWAY_API_SERVICE_ID: ${{ secrets.RAILWAY_API_SERVICE_ID }}
      RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
      RAILWAY_ENVIRONMENT_NAME: Production
      RAILWAY_DEPLOY_RETRIES: "3"
      RAILWAY_DEPLOY_RETRY_DELAY_MS: "10000"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Build API
        run: npm run build --workspace @pim1/api

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Capture rollback snapshot
        env:
          SNAPSHOT_OUTPUT: .run-logs/shopify-vnext-rollback-snapshot-${{ github.run_id }}.json
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node scripts/capture-shopify-vnext-rollback-snapshot.cjs \
            --release "${{ inputs.release_sha }}" \
            --tenant "${{ inputs.tenant }}" \
            --connector "${{ inputs.connector }}" \
            --installation "${{ inputs.installation }}" \
            --product "${{ inputs.product }}" \
            --shopifyProductGid "${{ inputs.shopify_product_gid }}" \
            --runUrl "${RUN_URL}" \
            --output "${SNAPSHOT_OUTPUT}"

      - name: Upload rollback snapshot evidence
        uses: actions/upload-artifact@v6
        with:
          name: shopify-vnext-rollback-snapshot-${{ github.run_id }}
          path: .run-logs/shopify-vnext-rollback-snapshot-${{ github.run_id }}.json
          if-no-files-found: error
