name: Staging Account Export Acceptance

on:
  workflow_dispatch:

jobs:
  account-export-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install system redis-server (for redis-memory-server)
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
          echo "REDISMS_SYSTEM_BINARY=$(command -v redis-server)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Sync smoke-test identity password
        shell: bash
        env:
          DATABASE_URL_DIRECT: ${{ secrets.STAGING_DATABASE_URL_DIRECT }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          RESET_IDENTITY_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
          STAGING_SMOKE_TENANT_ID: ${{ secrets.STAGING_SMOKE_TENANT_ID }}
          STAGING_SMOKE_USER: ${{ secrets.STAGING_SMOKE_USER }}
        run: |
          if [ -z "${DATABASE_URL_DIRECT}" ] && [ -z "${DATABASE_URL}" ]; then
            echo "Missing STAGING_DATABASE_URL_DIRECT or STAGING_DATABASE_URL — skipping password sync."
            exit 0
          fi
          if [ -z "${STAGING_SMOKE_USER}" ]; then
            echo "Missing STAGING_SMOKE_USER — skipping password sync."
            exit 0
          fi
          node scripts/reset-smoke-identity-password.cjs --tenant "${STAGING_SMOKE_TENANT_ID}" --user "${STAGING_SMOKE_USER}"

      - name: Resolve staging API URL
        id: resolve_api
        shell: bash
        env:
          FALLBACK_STAGING_API_URL: ${{ secrets.STAGING_BASE_URL }}
        run: |
          echo "api_url=${FALLBACK_STAGING_API_URL}" >> "$GITHUB_OUTPUT"

      - name: Run account export acceptance tests
        shell: bash
        env:
          STAGING_BASE_URL: ${{ steps.resolve_api.outputs.api_url }}
          STAGING_SMOKE_WORKSPACE: ${{ secrets.STAGING_SMOKE_WORKSPACE }}
          STAGING_SMOKE_USER: ${{ secrets.STAGING_SMOKE_USER }}
          STAGING_SMOKE_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
        run: |
          node scripts/staging-account-export-acceptance.cjs
