name: Staging Media Acceptance

on:
  workflow_dispatch:

jobs:
  media-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Resolve staging API URL
        id: resolve_api
        shell: bash
        env:
          FALLBACK_STAGING_API_URL: ${{ secrets.STAGING_BASE_URL }}
        run: |
          echo "api_url=${FALLBACK_STAGING_API_URL}" >> "$GITHUB_OUTPUT"

      - name: Resolve staging web URL
        id: resolve_web
        shell: bash
        env:
          FALLBACK_STAGING_WEB_URL: ${{ secrets.STAGING_WEB_URL }}
        run: |
          echo "web_url=${FALLBACK_STAGING_WEB_URL}" >> "$GITHUB_OUTPUT"

      - name: Run media acceptance tests
        shell: bash
        env:
          STAGING_BASE_URL: ${{ steps.resolve_api.outputs.api_url }}
          STAGING_WEB_URL: ${{ steps.resolve_web.outputs.web_url }}
          STAGING_SMOKE_WORKSPACE: ${{ secrets.STAGING_SMOKE_WORKSPACE }}
          STAGING_SMOKE_USER: ${{ secrets.STAGING_SMOKE_USER }}
          STAGING_SMOKE_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
        run: |
          node scripts/staging-media-acceptance.cjs
