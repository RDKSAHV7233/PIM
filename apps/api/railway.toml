[build]
buildCommand = "cd \"$(git rev-parse --show-toplevel)\" && npm ci && ./node_modules/.bin/prisma generate --schema packages/db/prisma/schema.prisma && npm run build --workspace @pim1/api"

[deploy]
startCommand = "node dist/main.js"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
