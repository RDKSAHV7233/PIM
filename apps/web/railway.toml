[build]
buildCommand = "npm ci --workspace @pim1/web && cd apps/web && NODE_OPTIONS=\"--max-old-space-size=4096\" ../../node_modules/.bin/next build"

[deploy]
startCommand = "cd apps/web && ../../node_modules/.bin/next start -p ${PORT:-3000}"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
