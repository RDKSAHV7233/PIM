[build]
buildCommand = "cd \"$(git rev-parse --show-toplevel)\" && npm ci && NODE_OPTIONS=\"--max-old-space-size=4096\" npm run build --workspace @pim1/web"

[deploy]
startCommand = "cd \"$(git rev-parse --show-toplevel)/apps/web\" && ../../node_modules/.bin/next start"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
