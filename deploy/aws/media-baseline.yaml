AWSTemplateFormatVersion: "2010-09-09"
Description: PIM1 media baseline (S3 + CloudFront OAC) for ap-south-1

Parameters:
  MediaBucketName:
    Type: String
    Description: Globally unique S3 bucket name for media assets.
  CloudFrontPriceClass:
    Type: String
    Default: PriceClass_100
    AllowedValues:
      - PriceClass_All
      - PriceClass_200
      - PriceClass_100
    Description: CloudFront price class.
  EnableVersioning:
    Type: String
    Default: "Enabled"
    AllowedValues:
      - Enabled
      - Suspended
    Description: Bucket versioning state.

Resources:
  MediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref MediaBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: !Ref EnableVersioning
      LifecycleConfiguration:
        Rules:
          - Id: stale-derived-assets
            Status: Enabled
            Prefix: derived/
            ExpirationInDays: 90
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      Tags:
        - Key: app
          Value: pim1
        - Key: component
          Value: media

  MediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MediaBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudFrontReadAccess
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action:
              - s3:GetObject
            Resource: !Sub "${MediaBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${MediaDistribution}"

  MediaOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-media-oac"
        Description: OAC for PIM1 media distribution.
        SigningBehavior: always
        SigningProtocol: sigv4
        OriginAccessControlOriginType: s3

  MediaDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "PIM1 media CDN (${AWS::StackName})"
        HttpVersion: http2
        PriceClass: !Ref CloudFrontPriceClass
        DefaultRootObject: index.html
        Origins:
          - Id: media-s3-origin
            DomainName: !GetAtt MediaBucket.RegionalDomainName
            S3OriginConfig: {}
            OriginAccessControlId: !Ref MediaOriginAccessControl
        DefaultCacheBehavior:
          TargetOriginId: media-s3-origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
          MinTTL: 0
          DefaultTTL: 86400
          MaxTTL: 31536000
        Restrictions:
          GeoRestriction:
            RestrictionType: none
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
        IPV6Enabled: true

Outputs:
  MediaBucketName:
    Description: S3 bucket name.
    Value: !Ref MediaBucket
    Export:
      Name: !Sub "${AWS::StackName}:MediaBucketName"
  MediaBucketArn:
    Description: S3 bucket ARN.
    Value: !GetAtt MediaBucket.Arn
    Export:
      Name: !Sub "${AWS::StackName}:MediaBucketArn"
  CloudFrontDistributionId:
    Description: CloudFront distribution id.
    Value: !Ref MediaDistribution
    Export:
      Name: !Sub "${AWS::StackName}:CloudFrontDistributionId"
  CloudFrontDomainName:
    Description: CloudFront domain for media delivery.
    Value: !GetAtt MediaDistribution.DomainName
    Export:
      Name: !Sub "${AWS::StackName}:CloudFrontDomainName"
  CloudFrontMediaBaseUrl:
    Description: CDN base URL for media references.
    Value: !Sub "https://${MediaDistribution.DomainName}"
    Export:
      Name: !Sub "${AWS::StackName}:CloudFrontMediaBaseUrl"
